<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta property="og:image" content="https://wm800.github.io/braindump-proto/icon-512.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="apple-touch-startup-image" href="splash-1170x2532.png" media="(device-width:390px) and (device-height:844px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="splash-1290x2796.png" media="(device-width:430px) and (device-height:932px) and (-webkit-device-pixel-ratio:3)">
<link rel="apple-touch-startup-image" href="splash-750x1334.png" media="(device-width:375px) and (device-height:667px) and (-webkit-device-pixel-ratio:2)">
<meta name="apple-mobile-web-app-title" content="Blob">
<title>Blob</title>
<style>
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #111; }
body { height: 100dvh; }
iframe { position: fixed; left: 0; top: 0; width: 100%; height: 100dvh; border: 0; display: block; }
#dev { position: fixed; right: calc(14px + env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom)); width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(0,0,0,.45); color: #fff; font: 18px sans-serif; opacity: .7; z-index: 20; touch-action: none; padding: 0; }
#panel { position: fixed; left: 0; right: 0; bottom: 0; max-height: 70dvh; overflow: auto; background: #1b1b1b; color: #eee; font: 14px/1.4 system-ui, sans-serif; padding: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom)); box-sizing: border-box; border-radius: 14px 14px 0 0; z-index: 25; display: none; }
#panel.open { display: block; }
#panel button { background: #333; color: #eee; border: 0; border-radius: 8px; padding: 8px 12px; margin: 2px; font: inherit; }
#panel button.cur { background: #2d7ff9; }
.row { display: flex; gap: 6px; align-items: center; margin-bottom: 10px; }
#cur { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list { display: flex; flex-direction: column; gap: 4px; }
.list button { text-align: left; width: 100%; }
</style>
</head>
<body>
<div id="boot" style="position:fixed;inset:0;z-index:99999;background:#000 url(icon-maskable-512.png) center/min(60vw,320px) no-repeat;transition:opacity .6s;pointer-events:none"></div>
<iframe id="frame" title="design"></iframe>
<button id="dev" aria-label="Panel">&#9679;</button>
<div id="panel">
  <div class="row"><button id="prev">&#9664;</button><span id="cur"></span><button id="next">&#9654;</button></div>
  <div class="row"><button id="toggleAll">Wszystkie</button><button id="fs">Pełny ekran</button><button id="zones"></button><button id="close">Zamknij</button></div>
  <div id="list" class="list"></div>
</div>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const frame = $('frame'), dev = $('dev'), panel = $('panel'), list = $('list'), cur = $('cur');
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  let names = [], all = false, name = null, last = '', poll = null;

  const fromHash = () => { try { return decodeURIComponent(location.hash.slice(1)); } catch { return ''; } };
  const pick = () => [fromHash(), store.get('proto.version'), names[0]].find(n => n && names.includes(n));
  const get = () => fetch('versions.json?t=' + Date.now(), { cache: 'no-store' }).then(r => r.json());

  function show(n, push, bust) {
    name = n;
    frame.src = 'v/' + encodeURIComponent(n) + '?' + (swap() ? 'zones=swap&' : '') + (bust ? 'r=' + Date.now() : '');
    store.set('proto.version', n);
    if (push) history.replaceState(null, '', '#' + encodeURIComponent(n));
    render();
  }

  function render() {
    cur.textContent = name || '';
    list.innerHTML = '';
    for (const n of all ? names : names.slice(0, 3)) {
      const b = document.createElement('button');
      b.textContent = n;
      if (n === name) b.className = 'cur';
      b.onclick = () => show(n, true);
      list.appendChild(b);
    }
    $('toggleAll').textContent = all ? 'Najnowsze 3' : 'Wszystkie';
  }

  function apply(data, bust) {
    last = JSON.stringify(data);
    names = data.map(v => v.file);
    const keep = name && names.includes(name) ? name : pick();
    if (!keep) return render();
    if (keep !== name || bust) show(keep, true, bust);
    else render();
  }

  async function refresh(bust) {
    try { apply(await get(), bust); } catch {}
  }

  function startPoll() {
    if (poll) return;
    poll = setInterval(async () => {
      try {
        const data = await get();
        if (JSON.stringify(data) !== last) apply(data, true);
      } catch {}
    }, 30000);
  }

  function step(d) {
    if (!names.length) return;
    const i = names.indexOf(name);
    show(names[(i + d + names.length) % names.length], true);
  }

  function place(l, t) {
    l = Math.max(0, Math.min(innerWidth - dev.offsetWidth, l));
    t = Math.max(0, Math.min(innerHeight - dev.offsetHeight, t));
    dev.style.left = l + 'px'; dev.style.top = t + 'px';
    dev.style.right = 'auto'; dev.style.bottom = 'auto';
  }

  function togglePanel(open) { panel.classList.toggle('open', open ?? !panel.classList.contains('open')); }

  let drag = null, moved = false;
  dev.addEventListener('pointerdown', e => {
    const r = dev.getBoundingClientRect();
    drag = { x: e.clientX, y: e.clientY, l: r.left, t: r.top };
    moved = false;
    dev.setPointerCapture(e.pointerId);
  });
  dev.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!moved && Math.hypot(dx, dy) < 6) return;
    moved = true;
    place(drag.l + dx, drag.t + dy);
  });
  dev.addEventListener('pointerup', () => {
    if (drag && moved) store.set('proto.pos', JSON.stringify({ l: dev.offsetLeft, t: dev.offsetTop }));
    if (drag && !moved) togglePanel();
    drag = null;
  });
  dev.addEventListener('pointercancel', () => { drag = null; });

  const swap = () => store.get('proto.zones') === 'swap';
  const zonesLabel = () => { $('zones').textContent = swap() ? 'Strefy: historia góra' : 'Strefy: mapa góra'; };
  $('zones').onclick = () => { store.set('proto.zones', swap() ? '' : 'swap'); zonesLabel(); if (name) show(name, false, true); };

  $('prev').onclick = () => step(-1);
  $('next').onclick = () => step(1);
  $('toggleAll').onclick = () => { all = !all; render(); };
  $('close').onclick = () => togglePanel(false);
  $('fs').onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
    else document.documentElement.requestFullscreen?.().catch(() => {});
  };
  addEventListener('hashchange', () => {
    const h = fromHash();
    if (h && h !== name && names.includes(h)) show(h, false);
  });

  try { store.set('proto.hidden', ''); } catch {}
  zonesLabel();
  try {
    const p = JSON.parse(store.get('proto.pos') || 'null');
    if (p) place(p.l, p.t);
  } catch {}

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

  refresh(false);
  if ('EventSource' in window) {
    const es = new EventSource('api/events');
    es.addEventListener('reload', () => refresh(true));
    es.onerror = () => { es.close(); startPoll(); };
  } else startPoll();
})();
</script>
<div id="inst" style="position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);z-index:9999;display:none;align-items:center;gap:12px;max-width:calc(100vw - 32px);padding:10px 14px;border-radius:22px;background:rgba(20,20,20,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.18);color:#eee;font:14px system-ui,sans-serif">
<img src="icon-192.png" width="32" height="32" style="border-radius:8px"><span id="instT">Zainstaluj Blob</span>
<button id="instB" style="border:0;border-radius:14px;padding:7px 14px;background:#fff;color:#000;font:inherit;font-weight:600">Zainstaluj</button>
<button id="instX" aria-label="Zamknij" style="border:0;background:none;color:#aaa;font-size:20px;padding:0 2px">×</button></div>
<script>(()=>{const K='blobInstDismiss',D=5*864e5,s=document.getElementById('inst');let ev=null;
const ok=()=>{try{return Date.now()-(+localStorage.getItem(K)||0)>D}catch(e){return true}};
const sa=matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone;
const hide=()=>{s.style.display='none'};
const dis=()=>{try{localStorage.setItem(K,Date.now())}catch(e){}hide()};
document.getElementById('instX').onclick=dis;
if(sa||!ok())return;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e;setTimeout(()=>{s.style.display='flex'},1500)});
addEventListener('appinstalled',hide);
document.getElementById('instB').onclick=async()=>{if(!ev)return dis();ev.prompt();await ev.userChoice;ev=null;dis()};
if(/iphone|ipad|ipod/i.test(navigator.userAgent)){document.getElementById('instT').innerHTML='Dotknij <b>Udostępnij</b> ⎙ → <b>Do ekranu głównego</b>';document.getElementById('instB').style.display='none';setTimeout(()=>{s.style.display='flex'},2500)}
})()</script>
<script>addEventListener("load",()=>setTimeout(()=>{const b=document.getElementById("boot");b.style.opacity=0;setTimeout(()=>b.remove(),700)},250))</script>
</body>
</html>

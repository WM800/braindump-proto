<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="icon" href="data:,">
<title>Braindump — home-A · Cell</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05070D;color:#E6F1FF;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#6B7A90}
.phone{position:relative;width:390px;height:844px;border-radius:44px;border:1px solid rgba(255,255,255,.08);overflow:hidden;background:#05070D;touch-action:none;user-select:none;-webkit-user-select:none}
@media (max-width:500px){body{gap:0}.label{display:none}.phone{width:100vw;height:100vh;height:100dvh;border-radius:0;border:0}}
#fx{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.panel{position:absolute;inset:0;z-index:1;will-change:transform}
#tl,#map{background:#05070D}
.edge{position:absolute;left:0;right:0;text-align:center;font-size:13px;letter-spacing:.08em;color:#6B7A90;text-shadow:0 0 10px rgba(63,245,224,.7)}
.top{top:50px}.bot{bottom:34px}
.cap{position:absolute;left:0;right:0;top:calc(50% + 92px);height:50px;text-align:center}
.cap>div{position:absolute;left:0;right:0;top:0;transition:opacity .3s}
#listen{opacity:0}#timer{font-size:22px;font-variant-numeric:tabular-nums;color:#3FF5E0;text-shadow:0 0 12px rgba(63,245,224,.6)}
#hint{color:#6B7A90;font-size:14px}
#listen div:last-child{font-size:13px;color:#6B7A90;margin-top:4px}
.toast{position:absolute;left:24px;right:24px;bottom:110px;text-align:center;font-size:13px;color:#3FF5E0;opacity:0;transition:opacity .6s;pointer-events:none}
.toast.on{opacity:1;transition:opacity 2s}
h2{position:absolute;left:24px;top:56px;font-size:12px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:#6B7A90}
#tl ul{position:absolute;left:24px;right:24px;top:96px;list-style:none}
.row{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.dot{width:7px;height:7px;border-radius:50%;background:#3FF5E0;box-shadow:0 0 8px #3FF5E0;margin-top:6px;flex:none}
.body{flex:1;min-width:0}
.t{display:block;font-size:11px;color:#6B7A90;letter-spacing:.04em}
.tx{display:block;font-size:15px;margin-top:3px;line-height:1.35}
.play{width:34px;height:34px;border-radius:50%;border:1px solid rgba(63,245,224,.45);background:none;color:#3FF5E0;font-size:11px;flex:none;cursor:pointer}
.wave{display:none;gap:3px;align-items:center;height:16px;margin-top:8px}
.row.playing .wave{display:flex}
.wave b{width:2px;height:4px;background:#3FF5E0;border-radius:2px;animation:wv .5s ease-in-out infinite alternate}
.wave b:nth-child(3n){animation-delay:.15s}.wave b:nth-child(3n+1){animation-delay:.3s}
@keyframes wv{to{height:15px}}
.node{position:absolute;left:0;top:0;border:0;border-radius:50%;padding:0;cursor:pointer}
.cl{position:absolute;transform:translate(-50%,-80px);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6B7A90;white-space:nowrap}
#lines{position:absolute;inset:0;width:100%;height:100%}
.tip{position:absolute;left:0;top:0;max-width:200px;padding:8px 12px;border-radius:12px;background:rgba(10,16,28,.9);border:1px solid rgba(63,245,224,.25);font-size:13px;line-height:1.35;opacity:0;transition:opacity .2s;pointer-events:none}
.tip.on{opacity:1}
</style>
</head>
<body>
<div class="label">home-A · Cell + Bioluminescence</div>
<div class="phone" id="phone">
  <canvas id="fx"></canvas>
  <section class="panel" id="home">
    <div class="edge top">Map ↑</div>
    <div class="cap">
      <div id="hint">Hold to think</div>
      <div id="listen"><div id="timer">0:00</div><div>Listening…</div></div>
    </div>
    <div class="toast" id="toast">Saved · transcribing in background</div>
    <div class="edge bot">Recent ↓</div>
  </section>
  <section class="panel" id="tl">
    <h2>Recent</h2>
    <ul id="list"></ul>
    <div class="edge bot">Home ↑</div>
  </section>
  <section class="panel" id="map">
    <h2>Map</h2>
    <svg id="lines"></svg>
    <div class="tip" id="tip"></div>
    <div class="edge bot">Home ↓</div>
  </section>
</div>
<script>
const $ = s => document.querySelector(s);
const frame = $('#phone'), cv = $('#fx'), ctx = cv.getContext('2d');
const home = $('#home'), tl = $('#tl'), mapEl = $('#map'), hint = $('#hint'), listen = $('#listen');
const timerEl = $('#timer'), toast = $('#toast'), tip = $('#tip'), list = $('#list'), svg = $('#lines');
const C = {cy:'63,245,224', bl:'42,123,255', wh:'230,241,255', vi:'120,200,255'};
const NOTES = [
  {time:'09:12', text:'Call mom about the weekend trip', duration:'0:14'},
  {time:'Yesterday 22:31', text:'Pitch: the app name should feel like light', duration:'0:22'},
  {time:'Yesterday 18:05', text:'Dentist moved to the 28th, confirm it', duration:'0:08'},
  {time:'Mon 14:20', text:'Garden layout: tomatoes on the south side', duration:'0:31'},
  {time:'Sun 11:02', text:"Grandpa's story about the boat in '74", duration:'0:47'},
  {time:'Sun 09:40', text:'Buy oat milk, check the lease renewal date', duration:'0:09'}
];
const CL = [
  {n:'Tasks', x:.26, y:.30, c:C.cy, t:['Buy oat milk','Renew the lease by Friday','Email Sam the draft','Book the dentist','Fix the bike brake','Send Anna the invoice']},
  {n:'Ideas', x:.74, y:.48, c:C.bl, t:['App name: something with light','Podcast about slow tech','Build a tiny kiln','Voice notes as cards','Garden layout by the fence','A map of my own mind']},
  {n:'Memories', x:.34, y:.74, c:C.vi, t:["Grandpa's fishing stories",'Lake trip, summer 2019','First day in Lisbon',"Mom's soup recipe",'Snow in the park','Old coffee shop on 5th']}
];
const TAU = Math.PI * 2;
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const NODES = [];
CL.forEach((cl, ci) => cl.t.forEach((text, j) => {
  const a = rnd() * TAU, r = 24 + rnd() * 64;
  NODES.push({text, cl:ci, dx:Math.cos(a) * r, dy:Math.sin(a) * r, s:8 + Math.round(rnd() * 8), ph:rnd() * TAU});
}));
const LINKS = [];
const link = (a, b) => {
  const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  ln.setAttribute('stroke', 'rgba(230,241,255,.25)');
  svg.appendChild(ln);
  LINKS.push([NODES[a], NODES[b], ln]);
};
for (let ci = 0; ci < 3; ci++) for (let j = 0; j < 5; j++) link(ci * 6 + j, ci * 6 + j + 1);
link(0, 6); link(8, 12);

NOTES.forEach((n, i) => {
  const li = document.createElement('li');
  li.className = 'row';
  li.innerHTML = `<i class="dot"></i><div class="body"><span class="t">${n.time}</span><span class="tx">${n.text}</span><span class="wave">${'<b></b>'.repeat(18)}</span></div><button class="play" aria-label="Play">▶</button>`;
  li.querySelector('.play').onclick = () => {
    const [m, s] = n.duration.split(':').map(Number);
    document.querySelectorAll('.row.playing').forEach(r => r.classList.remove('playing'));
    li.classList.add('playing');
    setTimeout(() => li.classList.remove('playing'), (m * 60 + s) * 1000);
  };
  list.appendChild(li);
});

CL.forEach(c => {
  const d = document.createElement('div');
  d.className = 'cl';
  d.textContent = c.n;
  d.style.left = c.x * 100 + '%';
  d.style.top = c.y * 100 + '%';
  mapEl.appendChild(d);
});
NODES.forEach(n => {
  const b = document.createElement('button');
  const c = CL[n.cl].c;
  b.className = 'node';
  b.style.width = b.style.height = n.s + 'px';
  b.style.background = `radial-gradient(circle,rgba(${c},.95) 0%,rgba(${c},.25) 60%,rgba(${c},0) 72%)`;
  b.style.boxShadow = `0 0 ${n.s}px rgba(${c},.6)`;
  b.onclick = () => {
    tip.textContent = n.text;
    tip.style.transform = `translate(${n.px + 14}px,${n.py - 20}px)`;
    tip.classList.add('on');
  };
  mapEl.appendChild(b);
  n.el = b;
});

let W = 0, H = 0, DPR = 1, cx = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = frame.clientWidth; H = frame.clientHeight; cx = W / 2;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// view state: pos -1 = map, 0 = home, 1 = timeline
let pos = 0, off = 0, tw = null, drag = null, dragDy = 0;
let rec = false, recId = null, recT0 = 0, shown = '', lvl = 0, T = 0;
const sc = {x:1, v:0, t:1, k:160, c:20};
const P = [], AMB = [];
const MAX = 400;
for (let i = 0; i < 30; i++) AMB.push({x:Math.random() * 390, y:Math.random() * 300, vy:6 + Math.random() * 10, r:1 + Math.random(), ph:Math.random() * TAU});

function add(p) { if (P.length >= MAX) P.splice(0, P.length - MAX + 1); P.push(p); }
function fx(x, y, n) {
  for (let i = 0; i < n; i++) add({k:'t', x:x + (Math.random() - .5) * 6, y:y + (Math.random() - .5) * 6,
    vx:(Math.random() - .5) * 20, vy:-(15 + Math.random() * 35), age:0, life:900 + Math.random() * 600,
    r:1 + Math.random() * 2, c:Math.random() < .5 ? C.cy : C.bl});
}
const pt = e => { const r = frame.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; };
const coreY = () => H / 2 - 40 + off;

function setPos(n) { tw = {from:off, t0:performance.now()}; pos = n; }
function step(d) { const n = Math.max(-1, Math.min(1, pos + d)); if (n !== pos) setPos(n); }

function startRec(id) {
  rec = true; recId = id; recT0 = performance.now(); shown = '';
  sc.t = 1.35; sc.k = 160; sc.c = 20;
  hint.style.opacity = 0; listen.style.opacity = 1;
}
function stopRec() {
  rec = false;
  sc.t = 1; sc.k = 300; sc.c = 12;
  hint.style.opacity = 1; listen.style.opacity = 0;
  add({k:'s', x:cx, y:coreY() + 70 * sc.x, vy:520, age:0, life:700, r:3, c:C.wh});
  toast.classList.add('on');
  setTimeout(() => toast.classList.remove('on'), 2600);
}

frame.addEventListener('pointerdown', e => {
  const p = pt(e);
  fx(p.x, p.y, 3 + (Math.random() * 4 | 0));
  if (e.target.closest('button')) return;
  if (pos === 0 && !rec && Math.hypot(p.x - cx, p.y - coreY()) < 90) { startRec(e.pointerId); return; }
  drag = {id:e.pointerId, y0:p.y}; dragDy = 0;
});
window.addEventListener('pointermove', e => {
  const p = pt(e);
  if (p.x >= 0 && p.y >= 0 && p.x <= W && p.y <= H) fx(p.x, p.y, 3 + (Math.random() * 4 | 0));
  if (drag && e.pointerId === drag.id) dragDy = p.y - drag.y0;
});
function end(e) {
  if (rec && e.pointerId === recId) stopRec();
  if (drag && e.pointerId === drag.id) {
    const d = dragDy; drag = null; dragDy = 0;
    if (d > 80) step(1); else if (d < -80) step(-1); else setPos(pos);
  }
}
window.addEventListener('pointerup', end);
window.addEventListener('pointercancel', end);
frame.addEventListener('wheel', e => {
  e.preventDefault();
  if (tw || drag || rec) return;
  step(e.deltaY > 0 ? 1 : -1);
}, {passive:false});
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') step(1);
  else if (e.key === 'ArrowUp') step(-1);
});

function spring(s, dt) {
  const a = (s.t - s.x) * s.k - s.v * s.c;
  s.v += a * dt; s.x += s.v * dt;
}
function wob(th) { return 0.5 * Math.sin(2 * th + T * 1.1) + 0.3 * Math.sin(3 * th - T * 1.7) + 0.2 * Math.sin(5 * th + T * 0.6); }
function dot(x, y, r, a, c) {
  ctx.fillStyle = `rgba(${c},${a * .22})`;
  ctx.beginPath(); ctx.arc(x, y, r * 3, 0, TAU); ctx.fill();
  ctx.fillStyle = `rgba(${c},${a})`;
  ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
}
function drawCore(cy) {
  const R = 70 * sc.x, amp = rec ? 0.15 * lvl : 0.02, br = 0.04 * Math.sin(T * Math.PI / 2);
  ctx.save(); ctx.translate(cx, cy);
  const g = ctx.createRadialGradient(0, 0, R * .6, 0, 0, R * 2.3);
  g.addColorStop(0, `rgba(${C.cy},.38)`); g.addColorStop(1, `rgba(${C.cy},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R * 2.3, 0, TAU); ctx.fill();
  ctx.beginPath();
  for (let i = 0; i <= 64; i++) {
    const th = i / 64 * TAU, r = R * (1 + br + amp * wob(th));
    const x = Math.cos(th) * r, y = Math.sin(th) * r;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
  const f = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 1.1);
  f.addColorStop(0, `rgba(${C.cy},.85)`); f.addColorStop(.6, `rgba(${C.cy},.35)`); f.addColorStop(1, `rgba(${C.bl},0)`);
  ctx.fillStyle = f; ctx.fill();
  ctx.strokeStyle = `rgba(${C.cy},.6)`; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

function frameLoop() {
  const now = performance.now();
  const dt = Math.min((now - (frameLoop.last || now)) / 1000, 1 / 30);
  frameLoop.last = now; T += dt;

  if (drag) off = pos * H + dragDy;
  else if (tw) {
    const p = clamp((now - tw.t0) / 450, 0, 1), e = 1 - Math.pow(1 - p, 3);
    off = tw.from + (pos * H - tw.from) * e;
    if (p >= 1) tw = null;
  } else off = pos * H;
  home.style.transform = `translateY(${off}px)`;
  tl.style.transform = `translateY(${off - H}px)`;
  mapEl.style.transform = `translateY(${off + H}px)`;

  spring(sc, dt);
  const vt = rec ? clamp(.5 + .5 * (.55 * Math.sin(T * 1.7) + .3 * Math.sin(T * 3.9 + 1.3) + .15 * Math.sin(T * 7.3) + (Math.random() * 2 - 1) * .3), 0, 1) : 0;
  lvl += (vt - lvl) * Math.min(1, dt * 6);

  if (rec) {
    const sec = Math.floor((now - recT0) / 1000);
    const str = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    if (str !== shown) { shown = str; timerEl.textContent = str; }
    const n = lvl * 2;
    const k = Math.floor(n) + (Math.random() < n % 1 ? 1 : 0);
    for (let i = 0; i < k; i++) add({k:'r', rad:220 + (Math.random() * 20 - 10), ang:Math.random() * TAU,
      sp:70 + Math.random() * 60, age:0, life:6000, r:1.6, c:C.cy, x:0, y:0});
  }

  const cy = coreY();
  ctx.clearRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';

  for (const a of AMB) {
    a.y += a.vy * dt;
    if (a.y > H + 4) { a.y = H - 170; a.x = Math.random() * W; }
    dot(a.x, a.y, a.r, .35 + .3 * Math.sin(a.ph + T * 1.5), C.cy);
  }
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i];
    p.age += dt * 1000;
    if (p.age >= p.life) { P.splice(i, 1); continue; }
    if (p.k === 'r') {
      p.rad -= p.sp * dt * (1 + (220 - p.rad) / 120);
      p.ang += dt * (.8 + (220 - p.rad) / 160);
      if (p.rad < 60) { P.splice(i, 1); continue; }
      p.x = cx + Math.cos(p.ang) * p.rad; p.y = cy + Math.sin(p.ang) * p.rad;
    } else if (p.k === 's') {
      p.y += p.vy * dt;
    } else {
      p.vx += (Math.random() - .5) * 40 * dt; p.vx *= .98;
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    const a = 1 - p.age / p.life;
    if (p.k === 'r') dot(p.x, p.y, p.r, a * clamp((220 - p.rad) / 60, .2, 1), p.c || C.cy);
    else dot(p.x, p.y, p.r || 2, a, p.c || C.wh);
  }
  ctx.globalCompositeOperation = 'source-over';
  drawCore(cy);

  for (const n of NODES) {
    const bx = CL[n.cl].x * W + n.dx, by = CL[n.cl].y * H + n.dy;
    n.px = bx + Math.sin(T * .6 + n.ph) * 4;
    n.py = by + Math.cos(T * .5 + n.ph) * 4;
    n.el.style.transform = `translate(${n.px - n.s / 2}px,${n.py - n.s / 2}px)`;
  }
  for (const [a, b, ln] of LINKS) {
    ln.setAttribute('x1', a.px); ln.setAttribute('y1', a.py);
    ln.setAttribute('x2', b.px); ln.setAttribute('y2', b.py);
  }
  requestAnimationFrame(frameLoop);
}
requestAnimationFrame(frameLoop);
</script>
</body>
</html>

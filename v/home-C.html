<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="icon" href="data:,">
<title>Braindump — home-C · Drop &amp; trail</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0E0B0A;color:#F3EBE4;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8A7D72}
.phone{position:relative;width:390px;height:844px;border-radius:44px;border:1px solid rgba(255,255,255,.08);overflow:hidden;background:#0E0B0A;touch-action:none;user-select:none;-webkit-user-select:none}
@media (max-width:500px){body{gap:0}.label{display:none}.phone{width:100vw;height:100vh;height:100dvh;border-radius:0;border:0}}
canvas{position:absolute;inset:0;width:100%;height:100%}
#mp{z-index:0;transform:translateX(100%)}
#fx{z-index:1;pointer-events:none}
#grain{z-index:3;opacity:.05;pointer-events:none}
.ui{position:absolute;inset:0;z-index:2;pointer-events:none}
.mapbtn{position:absolute;top:52px;right:16px;pointer-events:auto;padding:8px 14px;border-radius:16px;border:1px solid rgba(255,180,84,.2);background:rgba(255,180,84,.06);color:#F3EBE4;font:13px system-ui,sans-serif;cursor:pointer}
.stream{position:absolute;inset:0;pointer-events:none}
.bub{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;max-width:80%;padding:12px 18px;border-radius:22px;background:rgba(255,180,84,.08);border:1px solid rgba(255,180,84,.15);pointer-events:auto;transform-origin:50% 50%;cursor:pointer}
.bt{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.bm{font-size:11px;color:#8A7D72;margin-top:3px}
.full{max-height:0;overflow:hidden;transition:max-height .3s ease,margin .3s ease}
.bub.open .full{max-height:220px;margin-top:8px}
.bub.open .bt{white-space:normal;overflow:visible}
.full p{font-size:15px;line-height:1.4}
.cr{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;color:#8A7D72}
.pl{width:28px;height:28px;border-radius:50%;border:1px solid rgba(255,180,84,.4);background:none;color:#FFB454;font-size:9px;cursor:pointer;flex:none}
.bar{flex:1;height:3px;border-radius:2px;background:rgba(255,180,84,.15);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#FFB454}
.shim{background:linear-gradient(90deg,#8A7D72 30%,#F3EBE4 50%,#8A7D72 70%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.timer{position:absolute;left:0;right:0;bottom:236px;text-align:center;font-size:20px;color:#FFB454;font-variant-numeric:tabular-nums;opacity:0;transition:opacity .3s;pointer-events:none}
.hint{position:absolute;left:0;right:0;bottom:40px;text-align:center;font-size:13px;color:#8A7D72;pointer-events:none}
</style>
</head>
<body>
<div class="label">home-C · Drop &amp; trail + Microscope</div>
<div class="phone" id="phone">
  <canvas id="mp"></canvas>
  <canvas id="fx"></canvas>
  <div class="ui">
    <button class="mapbtn" id="mapbtn">Map</button>
    <div class="stream" id="stream"></div>
    <div class="timer" id="timer">0:00</div>
    <div class="hint" id="hint">Hold the drop to speak</div>
  </div>
  <canvas id="grain"></canvas>
</div>
<script>
const $ = s => document.querySelector(s);
const frame = $('#phone'), fx = $('#fx'), f = fx.getContext('2d'), mp = $('#mp'), m2 = mp.getContext('2d');
const gr = $('#grain'), g2 = gr.getContext('2d');
const stream = $('#stream'), timerEl = $('#timer'), hint = $('#hint'), mapbtn = $('#mapbtn');
const AMB = '255,180,84', COR = '255,107,90', MUTED = '138,125,114';
const TAU = Math.PI * 2, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const NOTES = [
  {time:'09:12', text:'Call mom about the weekend trip', duration:'0:14'},
  {time:'Yesterday 22:31', text:'Pitch: the app name should feel like light', duration:'0:22'},
  {time:'Yesterday 18:05', text:'Dentist moved to the 28th, confirm it', duration:'0:08'},
  {time:'Mon 14:20', text:'Garden layout: tomatoes on the south side', duration:'0:31'},
  {time:'Sun 11:02', text:"Grandpa's story about the boat in '74", duration:'0:47'},
  {time:'Sun 09:40', text:'Buy oat milk, check the lease renewal date', duration:'0:09'}
];
let W = 0, H = 0, DPR = 1;
const CX = () => W / 2, CORE_Y = () => H - 168, BOTTOM = () => H - 240;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 3);
  W = frame.clientWidth; H = frame.clientHeight;
  for (const c of [fx, mp]) { c.width = W * DPR; c.height = H * DPR; }
  f.setTransform(DPR, 0, 0, DPR, 0, 0); m2.setTransform(DPR, 0, 0, DPR, 0, 0);
  gr.width = W >> 1; gr.height = H >> 1;
}
window.addEventListener('resize', resize);
resize();

function grain() {
  const im = g2.createImageData(gr.width, gr.height), d = im.data;
  for (let i = 0; i < d.length; i += 4) { const v = Math.random() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }
  g2.putImageData(im, 0, 0);
}
setInterval(grain, 100);

// stream of thought bubbles, items[0] = newest (lowest)
const items = [];
function makeItem(n, text, shim) {
  const el = document.createElement('div');
  el.className = 'bub';
  el.innerHTML = `<div class="bt"><span${shim ? ' class="shim"' : ''}>${text}</span></div><div class="bm">${n.time}</div>` +
    `<div class="full"><p>${text}</p><div class="cr"><button class="pl" aria-label="Play">▶</button><span class="bar"><i></i></span><span>${n.duration}</span></div></div>`;
  el.onclick = e => { if (!e.target.closest('.pl')) el.classList.toggle('open'); };
  el.querySelector('.pl').onclick = () => {
    const [m, s] = n.duration.split(':').map(Number), bar = el.querySelector('.bar i');
    bar.style.transition = 'none'; bar.style.width = '0'; void bar.offsetWidth;
    bar.style.transition = `width ${m * 60 + s}s linear`; bar.style.width = '100%';
  };
  stream.appendChild(el);
  return {el, n, y:0, v:0, h:0, ty:0, g:1, ph:Math.random() * TAU};
}
NOTES.forEach(n => items.push(makeItem(n, n.text, false)));

function release() {
  const it = makeItem({time:'Just now', duration:'0:12'}, 'Transcribing…', true);
  it.g = 0; it.y = CORE_Y() - 20; it.v = 0; it.init = true;
  items.unshift(it);
  setTimeout(() => {
    const s = it.el.querySelector('.bt span'), p = it.el.querySelector('.full p');
    s.classList.remove('shim'); s.textContent = p.textContent = 'New thought about the project name';
  }, 2000);
}

// map
let seed = 5;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const CL = [{n:'Tasks', x:.28, y:.30, c:AMB}, {n:'Ideas', x:.72, y:.50, c:COR}, {n:'Memories', x:.34, y:.74, c:AMB}];
const CELLS = [];
CL.forEach((c, ci) => {
  for (let j = 0; j < 8; j++) {
    const a = rnd() * TAU, r = 20 + rnd() * 110;
    CELLS.push({cl:ci, dx:Math.cos(a) * r, dy:Math.sin(a) * r * .8, r:10 + rnd() * 10, ph:rnd() * TAU});
  }
});
const STRANDS = [[0, 8], [12, 16]];
CL.forEach((c, ci) => { for (let j = 0; j < 7; j++) STRANDS.push([ci * 8 + j, ci * 8 + j + 1]); });

// state
let mapOpen = false, mv = 0, rec = false, recId = null, recT0 = 0, shown = '';
let gest = null, lvl = 0, T = 0, last = 0;
const FX = [], BLOBS = [], MAX = 400;

function spawn(x, y, n) {
  for (let i = 0; i < n; i++) FX.push({x:x + (Math.random() - .5) * 6, y:y + (Math.random() - .5) * 6,
    vx:(Math.random() - .5) * 16, vy:-(12 + Math.random() * 30), age:0, life:900 + Math.random() * 600,
    r:1 + Math.random() * 2, c:Math.random() < .5 ? AMB : COR});
  if (FX.length > MAX) FX.splice(0, FX.length - MAX);
}
const pt = e => { const r = frame.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; };
function setMap(v) { mapOpen = v; mapbtn.textContent = v ? '‹ Back' : 'Map'; }
mapbtn.onclick = () => setMap(!mapOpen);

frame.addEventListener('pointerdown', e => {
  const p = pt(e);
  spawn(p.x, p.y, 3 + (Math.random() * 4 | 0));
  if (e.target.closest('.ui')) return;
  if (mapOpen || p.x > W - 32) { gest = {id:e.pointerId, x0:p.x}; return; }
  if (Math.hypot(p.x - CX(), p.y - CORE_Y()) < 56) {
    rec = true; recId = e.pointerId; recT0 = performance.now(); shown = '';
    hint.textContent = 'Listening…'; timerEl.style.opacity = 1;
  }
});
window.addEventListener('pointermove', e => {
  const p = pt(e);
  if (p.x >= 0 && p.y >= 0 && p.x <= W && p.y <= H) spawn(p.x, p.y, 3 + (Math.random() * 4 | 0));
});
function up(e) {
  const p = pt(e);
  if (rec && e.pointerId === recId) {
    rec = false; hint.textContent = 'Hold the drop to speak'; timerEl.style.opacity = 0;
    release();
  }
  if (gest && gest.id === e.pointerId) {
    const dx = p.x - gest.x0;
    if (!mapOpen && dx < -80) setMap(true);
    else if (mapOpen && dx > 80) setMap(false);
    gest = null;
  }
}
window.addEventListener('pointerup', up);
window.addEventListener('pointercancel', up);

function drawBlob(x, y, r, c, a) {
  const g = f.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${c},${.55 * a})`); g.addColorStop(.6, `rgba(${c},${.2 * a})`); g.addColorStop(1, `rgba(${c},0)`);
  f.fillStyle = g; f.beginPath(); f.arc(x, y, r, 0, TAU); f.fill();
}
function drawCore(cy, lv) {
  const R = 48 * (1 + (rec ? .12 * lv : 0) + .02 * Math.sin(T * 2)), cx = CX();
  f.beginPath();
  for (let i = 0; i <= 48; i++) {
    const th = i / 48 * TAU, r = R * (1 + .03 * Math.sin(3 * th + T * 2) + .02 * Math.sin(5 * th - T * 1.3));
    i ? f.lineTo(cx + Math.cos(th) * r, cy + Math.sin(th) * r) : f.moveTo(cx + r, cy);
  }
  f.closePath();
  const g = f.createRadialGradient(cx, cy - 10, 4, cx, cy, R);
  g.addColorStop(0, `rgba(${AMB},.35)`); g.addColorStop(1, `rgba(${COR},.06)`);
  f.fillStyle = g; f.fill();
  f.strokeStyle = `rgba(${AMB},.15)`; f.lineWidth = 2; f.stroke();
  f.beginPath(); f.arc(cx, cy, R * .55, 0, TAU); f.strokeStyle = `rgba(${AMB},.08)`; f.lineWidth = 1; f.stroke();
}
function drawMap() {
  m2.fillStyle = '#0E0B0A'; m2.fillRect(0, 0, W, H);
  const P = CELLS.map(c => { const cl = CL[c.cl]; return {x:cl.x * W + c.dx + Math.sin(T * .5 + c.ph) * 3, y:cl.y * H + c.dy + Math.cos(T * .4 + c.ph) * 3, r:c.r, col:cl.c}; });
  m2.lineWidth = 1.5; m2.strokeStyle = `rgba(${AMB},.18)`;
  for (const [a, b] of STRANDS) {
    const A = P[a], B = P[b], mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, dx = B.x - A.x, dy = B.y - A.y;
    m2.beginPath(); m2.moveTo(A.x, A.y);
    m2.quadraticCurveTo(mx - dy * .2, my + dx * .2, B.x, B.y); m2.stroke();
  }
  for (const p of P) {
    const g = m2.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 1.4);
    g.addColorStop(0, `rgba(${p.col},.35)`); g.addColorStop(.7, `rgba(${p.col},.12)`); g.addColorStop(1, `rgba(${p.col},0)`);
    m2.fillStyle = g; m2.beginPath(); m2.arc(p.x, p.y, p.r * 1.4, 0, TAU); m2.fill();
  }
  m2.font = '11px system-ui, sans-serif'; m2.textAlign = 'center'; m2.fillStyle = `rgba(${MUTED},.9)`;
  for (const c of CL) m2.fillText(c.n.toUpperCase(), c.x * W, c.y * H - 80);
  m2.textAlign = 'left'; m2.fillStyle = '#F3EBE4'; m2.font = '15px system-ui, sans-serif';
  m2.fillText('Memory map', 20, 66);
}

function frameLoop() {
  const now = performance.now();
  const dt = Math.min((now - (last || now)) / 1000, 1 / 30);
  last = now; T += dt;

  mv += ((mapOpen ? 1 : 0) - mv) * Math.min(1, dt * 7);
  if (Math.abs(mv - (mapOpen ? 1 : 0)) < .001) mv = mapOpen ? 1 : 0;
  mp.style.transform = `translateX(${(1 - mv) * 100}%)`;
  stream.style.opacity = 1 - mv;

  const vt = rec ? clamp(.5 + .5 * (.55 * Math.sin(T * 1.7) + .3 * Math.sin(T * 3.9 + 1.3) + .15 * Math.sin(T * 7.3) + (Math.random() * 2 - 1) * .3), 0, 1) : 0;
  lvl += (vt - lvl) * Math.min(1, dt * 6);
  if (rec) {
    const sec = Math.floor((now - recT0) / 1000);
    const str = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    if (str !== shown) { shown = str; timerEl.textContent = str; }
    if (Math.random() < lvl * .8) BLOBS.push({x:CX() + (Math.random() - .5) * 18, y:CORE_Y(), vy:-(30 + Math.random() * 50),
      r:10 + Math.random() * 10, age:0, life:1800 + Math.random() * 800, ph:Math.random() * TAU, c:Math.random() < .5 ? AMB : COR});
    if (BLOBS.length > 60) BLOBS.splice(0, BLOBS.length - 60);
  }

  let b = BOTTOM();
  items.forEach((it, i) => {
    it.h = it.el.offsetHeight; it.ty = b - it.h; b = it.ty - 12;
    it.dx = i % 2 ? 20 : -20;
    if (!it.init) { it.init = true; it.y = it.ty; }
  });
  items.forEach((it, i) => {
    const a = (it.ty - it.y) * 120 - it.v * 16;
    it.v += a * dt; it.y += it.v * dt;
    if (it.g < 1) it.g = Math.min(1, it.g + dt * 2);
    const sc = .3 + .7 * (1 - (1 - it.g) * (1 - it.g));
    const al = Math.max(.3, 1 - i * .14);
    it.el.style.transform = `translate(${it.dx}px,${(it.y + Math.sin(T * .9 + it.ph) * 2).toFixed(1)}px) scale(${it.g < 1 ? sc.toFixed(3) : 1})`;
    it.el.style.opacity = al.toFixed(2);
  });

  f.clearRect(0, 0, W, H);
  f.globalCompositeOperation = 'lighter';
  for (let i = BLOBS.length - 1; i >= 0; i--) {
    const q = BLOBS[i];
    q.age += dt * 1000;
    if (q.age >= q.life) { BLOBS.splice(i, 1); continue; }
    q.y += q.vy * dt; q.vy *= .99; q.x += Math.sin(q.ph + T * 2) * 8 * dt;
    if (mv < .02) drawBlob(q.x, q.y, q.r * (1 + q.age / q.life * .8), q.c, 1 - q.age / q.life);
  }
  for (let i = FX.length - 1; i >= 0; i--) {
    const p = FX[i];
    p.age += dt * 1000;
    if (p.age >= p.life) { FX.splice(i, 1); continue; }
    p.vx += (Math.random() - .5) * 30 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    const a = 1 - p.age / p.life;
    f.fillStyle = `rgba(${p.c},${a * .2})`; f.beginPath(); f.arc(p.x, p.y, p.r * 3, 0, TAU); f.fill();
    f.fillStyle = `rgba(${p.c},${a})`; f.beginPath(); f.arc(p.x, p.y, p.r, 0, TAU); f.fill();
  }
  f.globalCompositeOperation = 'source-over';
  if (mv < .02) drawCore(CORE_Y(), lvl);
  if (mv > .001) drawMap();
  requestAnimationFrame(frameLoop);
}
requestAnimationFrame(frameLoop);
</script>
</body>
</html>

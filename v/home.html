// ONE organic engine: every blob (core parts, droplets, thought orbs) is a damped particle pulled to a target,

const P0 = {

  kShape:60, dampR:1, recLoose:.55, kLink:60, lobeMax:.7, onsetKick:260, agcFloor:.4, agcPeak:.35, puffK:90, bandPush:25, toneStretch:.35, shiver:14, lvlAtk:30, lvlRel:7, bandAtk:28, bandRel:6, onsetGap:90, onsetRatio:1.2, onsetMin:.18, voiceWave:1.5, voiceWaveGap:450, toneSwirl:900, maxStretch:1.8, followMax:8, grabPull:16,

  topY:.05, bottomY:.30, spread:1, yCurve:1, jitter:.04, jitterY:.03, newB:1.35, oldB:.5, homeK:.08, homeRate:.15, homeGap:95, homePull:.02, gapBreath:.2, wander:1.8, stagger:.6, repel:5, cohesion:.15, tailK:40, tailC:8, arriveT:5, leaveT:6, leaveDim:.6, edgeFade:.09, maxThoughts:8, labelGap:22,

const P = Object.assign({}, P0);
try { Object.assign(P, JSON.parse(localStorage.getItem('bd_tune_v20')) || {}); } catch (e) {}
const VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
// FROM core6/home9 — shading verbatim; additions: wave bend of p, field sharpness uK (1 = original), per-ball light weight b.w, exponential aura
const FS = `precision highp float;
uniform vec2 uRes;uniform float uDpr,uRim,uGR,uK,uWL;uniform vec2 uLD,uLP;uniform float uLH,uNB,uNM,uSep,uRW;uniform vec4 uB[40];
uniform vec4 uM[48];uniform float uPin[24];uniform vec4 uAura;uniform vec4 uGlow[4];uniform vec4 uW[6];
void main(){
  vec2 p=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y)/uDpr;
  for(int i=0;i<6;i++){vec4 w=uW[i];if(w.w<=0.)continue;vec2 dv=p-w.xy;float d=max(length(dv),1.);float x=(d-w.z)/uWL;p+=dv/d*w.w*sin(x*6.2832)*exp(-x*x*2.);}
  float f=0.;vec2 G=vec2(0.);float lw=0.;
  vec4 fA=vec4(0.),fB=vec4(0.),xA=vec4(0.),yA=vec4(0.),xB=vec4(0.),yB=vec4(0.);
  for(int i=0;i<40;i++){if(float(i)>=uNB)break;vec4 b=uB[i];if(b.z<=0.)continue;vec2 dv=p-b.xy;float d2=max(dot(dv,dv),1.);float q=b.z*b.z/d2;if(uK!=1.)q=pow(q,uK);vec2 g=-2.*uK*q*dv/d2;
    float gi=floor(b.w*.5);vec4 mA=vec4(equal(vec4(gi),vec4(0.,1.,2.,3.))),mB=vec4(equal(vec4(gi),vec4(4.,5.,6.,7.)));
    fA+=q*mA;fB+=q*mB;xA+=g.x*mA;yA+=g.y*mA;xB+=g.x*mB;yB+=g.y*mB;lw+=q*(b.w-2.*gi);}
  // cut pieces: each group is its own body; groups join by a smooth union (p-norm), blended in by uSep
  {vec4 o=vec4(1.);f=dot(fA,o)+dot(fB,o);G=vec2(dot(xA,o)+dot(xB,o),dot(yA,o)+dot(yB,o));
   if(uSep>0.){float pe=1.+5.*uSep;vec4 sA=max(fA,vec4(1e-5)),sB=max(fB,vec4(1e-5));vec4 a5=pow(sA,vec4(pe-1.)),b5=pow(sB,vec4(pe-1.));
     float S=dot(a5*fA,o)+dot(b5*fB,o);float fs=pow(max(S,1e-9),1./pe);float fs5=max(pow(fs,pe-1.),1e-6);
     f=fs;G=vec2(dot(a5,xA)+dot(b5,xB),dot(a5,yA)+dot(b5,yB))/fs5;}}
  float lwn=f>0.?lw/f:1.;
  float gn=max(length(G),1e-4);
  float sd=(f-1.)/gn;
  float m=smoothstep(-.7,.7,sd);
  float og=exp(-max(-sd,0.)/uGR);
  float edge=uRW>0.?(1.-smoothstep(0.,uRW,sd))*(1.-smoothstep(1.4,3.,f)):1.-smoothstep(1.,1.8,f);
  vec3 N=normalize(vec3(-G/gn*edge*.9,1.));
  // lamp under the finger/cursor: original shading, direction toward the lamp point, its pull fading softly with distance (uLH)
  vec2 ldv=uLP-p;float ldd=max(length(ldv),1.);vec2 ld=ldv/ldd;float att=1./(1.+ldd*ldd/(uLH*uLH));
  vec3 Lv=normalize(vec3(ld*.6,.8)),Hv=normalize(Lv+vec3(0.,0.,1.));
  float side=max(dot(N.xy,ld),0.);
  float rim=edge*edge*uRim*(.6+1.2*side*side*att)*lwn*(1.-.3*uSep);
  float sp=pow(max(dot(N,Hv),0.),40.)*.3*edge*lwn*(.4+.6*att);
  float c=mix(0.,.039+rim+sp,m)+og*(1.-m)*.08*lwn;
  float f2=0.,w2=0.,pw=0.;vec2 G2=vec2(0.);
  for(int i=0;i<48;i++){if(float(i)>=uNM)break;vec4 b=uM[i];if(b.z<=0.)continue;vec2 dv=p-b.xy;float d2=max(dot(dv,dv),1.);float c2=b.z*b.z/d2;f2+=c2;G2-=2.*c2*dv/d2;w2+=c2*b.w;pw+=c2*uPin[i/2];}
  float bw=f2>0.?w2/f2:0.;
  float m2=smoothstep(.98,1.02,f2);
  float gn2=max(length(G2),1e-4);
  float e2=uRW>0.?(1.-smoothstep(0.,uRW*.8,(f2-1.)/gn2))*(1.-smoothstep(1.4,3.,f2)):1.-smoothstep(1.,1.8,f2);
  // thoughts use the core's own shading scaled by their brightness bw (1 = exactly like the core); pinned = filled lit sphere
  vec3 N2=normalize(vec3(-G2/gn2*e2*.9,1.));
  float side2=max(dot(N2.xy,ld),0.);
  float pk=f2>0.?pw/f2:0.;
  float body=.039*bw+pk*(.55+.45*sqrt(max(0.,1.-1./max(f2,1.))));
  float rim2=e2*e2*uRim*(.6+1.2*side2*side2*att)*(bw+pk*.5);
  float sp2=pow(max(dot(N2,Hv),0.),40.)*.3*e2*(.4+.6*att)*(bw+pk*.5);
  float og2=exp(-max(-(f2-1.)/gn2,0.)/uGR);
  c=mix(c,body+rim2+sp2,m2)+og2*(1.-m2)*.08*bw;
  for(int i=0;i<4;i++){vec4 g=uGlow[i];if(g.w<=0.)continue;float d=length(p-g.xy);c+=g.w*(exp(-d/g.z)+.12*exp(-d/(5.*g.z)));}
  if(uAura.w>0.){float d=length(p-uAura.xy);c+=uAura.w*(exp(-d/uAura.z)+.12*exp(-d/(5.*uAura.z)));}
  gl_FragColor=vec4(vec3(c),1.);

let W = 0, H = 0, DPR = 1, T = 0, last = performance.now(), br = 0;
let lvl = 0, avg = 0, rimS = .45, grS = 18, rv = 0, spAcc = 0, tearCd = 0, shoutEnd = -1e9;
const PB = [0, 0, 0, 0, 0, 0], FX = [0, 0, 0, 0, 0, 0], BF = [0, 0, 0, 0, 0, 0], BP2 = [.1, .1, .1, .1, .1, .1];
let envS = 0, puff = 0, toneS = 0;
let lastVWave = -1e9, fluxAvg = 0, centAvg = 2.5, toneV = 0, grabP = null, rec = false, recId = null, recT0 = 0, shown = -1, drop = null, lastOnset = -1e9;
let micState = 'idle', an = null, ctxA = null, tbuf = null, freq = null;

let LP = [0, 0], PX = 0, PY = 0, lPX = 0, lPY = 0, lastIn = -1e9, LD = [1, 0], CX = 0, CY = 0, RR = 72, psp = 0, FVX = 0, FVY = 0;
let drag = null, swipe = null, pts = new Map(), lastEmpty = -1e9, hidden = false, visFrom = 1, visTo = 1, visStart = -1e9, vis = 1;
let textOrb = null, textShowT = -1e9, dropPulseT = -1e9, corner = [], SEQ = 0;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (() => { let s = 11; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
const hsh = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return (s - Math.floor(s)) * 2 - 1; };
const vnoise = x => { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return hsh(i) + (hsh(i + 1) - hsh(i)) * u; };
const spdRand = () => P.splashSpeedMin + (P.splashSpeedMax - P.splashSpeedMin) * Math.random();
const CORE = (() => {
  let s = 5; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const big = [[.40, .10, 0], [.36, .12, 2.2], [.32, .14, 4.1]];
  const parts = big.map(([rf, of, a], i) => ({rf, of, a, km:1.2, per:9 + 3 * i, band:-1}));
  for (let k = 0; k < 7; k++) parts.push({rf:.14 + .16 * r(), of:.26 + .2 * r(), a:k * TAU / 7 + (r() - .5) * .7, km:.7 + .6 * r(), per:8 + 7 * r(), band:k % 6});
  return parts.map(q => Object.assign(q, {x:null, y:null, vx:0, vy:0, r:0, tx:0, ty:0, ax:0, ay:0}));
})();

function mkOrb(text) {
  const id = SEQ++;
  return {id, text, fx:hsh(id * 3.1), ry:hsh(id * 7.7), P:18 + 12 * rnd(), ph:rnd() * TAU, r:6 + 8 * rnd(), s:1, x:null, y:null, vx:0, vy:0, ax:0, ay:0,
    qx:null, qy:null, qvx:0, qvy:0, tw:.07, rank:0, lastRank:-2, applyAt:-1e9, hx:0, hy:0, rs:1, dim:1, state:'ok', pinned:false, px:0, py:0, grab:false, gx:undefined, gy:undefined,
    pulseT:-1e9, mx:0, my:0, mT:0, goneT:0, sx:0, sy:0, arriveT:0, leaveT:0, lx:0, ly:0};

const ORBS = TEXTS.map(t => mkOrb(t));

function makeView() {
  const cv = document.getElementById('gl'), g = cv.getContext('webgl', {alpha:false, antialias:false});
  const v = {cv, gl:g, L:{}, B:new Float32Array(160), M:new Float32Array(192), PN:new Float32Array(24), GL:new Float32Array(16), AU:new Float32Array([0, 0, 1, 0]), WU:new Float32Array(24)};
  if (!g) return v;
  const sh = (t, s) => { const o = g.createShader(t); g.shaderSource(o, s); g.compileShader(o); if (!g.getShaderParameter(o, g.COMPILE_STATUS)) console.error(g.getShaderInfoLog(o)); return o; };

}
const HV = makeView();
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2); W = PH.clientWidth; H = PH.clientHeight;
  HV.cv.width = Math.round(W * DPR); HV.cv.height = Math.round(H * DPR);

window.addEventListener('resize', resize);
resize();

// FROM core6: microphone
function startMic() {
  if (micState !== 'idle') return;
  micState = 'pending';
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { micState = 'off'; MIC.style.display = 'block'; return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(st => {
    const AC = window.AudioContext || window.webkitAudioContext;
    ctxA = new AC();
    an = ctxA.createAnalyser(); an.fftSize = 512; an.smoothingTimeConstant = .8;
    ctxA.createMediaStreamSource(st).connect(an);
    tbuf = new Float32Array(an.fftSize); freq = new Uint8Array(an.frequencyBinCount);
    micState = 'on';
  }).catch(() => { micState = 'off'; MIC.style.display = 'block'; });
}
function micLevels() {
  an.getFloatTimeDomainData(tbuf);
  let s = 0; for (let i = 0; i < tbuf.length; i++) s += tbuf[i] * tbuf[i];
  const rms = Math.sqrt(s / tbuf.length), gate = rms < .02;
  const L = gate ? 0 : Math.sqrt(Math.min(1, rms / .3));
  an.getByteFrequencyData(freq);
  const hz = ctxA.sampleRate / an.fftSize, out = [];
  for (let k = 0; k < 6; k++) {
    const i0 = Math.max(1, Math.floor(80 * Math.pow(50, k / 6) / hz)), i1 = Math.max(i0, Math.min(freq.length - 1, Math.ceil(80 * Math.pow(50, (k + 1) / 6) / hz)));
    let sum = 0; for (let i = i0; i <= i1; i++) sum += freq[i];
    out.push(gate ? 0 : Math.sqrt(sum / (i1 - i0 + 1) / 255));
  }
  return {lvl:L, bands:out};
}

// FROM core6: recording
function startRec() {

function stopRec() {

function spring(s, dt) {
  const a = (s.t - s.x) * 70 - s.v * 12.5;
  s.v += a * dt; s.x += s.v * dt;
}
function springXY(s, tg, k, c, dt) { const a = (tg - s.p) * k - s.v * c; s.v += a * dt; s.p += s.v * dt; }

// FROM thoughts6: visibility
const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;

}
// new thought: rising droplet from the core becomes the newest orb (rank 0)

  const d = new Date(), tm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  const o = mkOrb('New thought ' + tm);
  o.state = 'arrive'; o.arriveT = now; o.hx = W / 2 + (o.fx - .5) * 40; o.hy = H * P.bottomY; o.sx = CX; o.sy = CY - RR * .2; o.x = o.sx; o.y = o.sy; o.s = P.birthR; o.detT = 0;

  for (let i = Math.min(P.maxThoughts, 24 - ORBS.filter(q => q.pinned).length - 1); i < free.length; i++) { const q = free[i]; q.state = 'leave'; q.leaveT = now; q.lx = q.x; q.ly = q.y; }
}

function spawnDrop(posAng, velAng, spd) {

}

function save() { try { localStorage.setItem('bd_tune_v20', JSON.stringify(P)); } catch (e) {} }
function toggleDev() { DEV.classList.toggle('on'); if (DEV.classList.contains('on')) buildDev(); }
const INT = {maxThoughts:9, maxDrops:30};
const META = Object.keys(P0).map(k => {
  const v = P0[k], mx = INT[k] || (v === 0 ? 1 : v <= 1 ? Math.max(1, v * 3) : v * 3);
  return [k, 0, +mx.toFixed(3), INT[k] ? 1 : +(mx / 200).toPrecision(2)];
});
function buildDev() {

    const a = SCAR[SCAR.length - 2], b = SCAR[SCAR.length - 1];
    if (a.id === b.id) for (const o of ORBS) {
      if (o.x === null || o.state !== 'ok') continue;
      const ex = b.x - a.x, ey = b.y - a.y, L = ex * ex + ey * ey || 1, t = clamp(((o.x - a.x) * ex + (o.y - a.y) * ey) / L, 0, 1);
      const qx = a.x + ex * t, qy = a.y + ey * t;
      if (Math.hypot(o.x - qx, o.y - qy) > o.r * o.s + 6) continue;
      const nl = Math.sqrt(L), nx = -ey / nl, ny = ex / nl, k2 = o.r * P.orbSplit * clamp(psp / P.fingerFast, .6, 2);
      o.cvx = (o.cvx || 0) + nx * k2; o.cvy = (o.cvy || 0) + ny * k2;
    }
  }
  for (const o of ORBS) {
    o.cx2 = o.cx2 || 0; o.cy2 = o.cy2 || 0; o.cvx = o.cvx || 0; o.cvy = o.cvy || 0;
    const hk = P.orbHeal, hc = 2 * Math.sqrt(hk);
    o.cvx += (-o.cx2 * hk - o.cvx * hc) * dt; o.cvy += (-o.cy2 * hk - o.cvy * hc) * dt;
    o.cx2 += o.cvx * dt; o.cy2 += o.cvy * dt;
  }

  const M = HV.M, PN = HV.PN, GL = HV.GL, AU = HV.AU;
  M.fill(0); PN.fill(0); GL.fill(0); for (let i = 2; i < 16; i += 4) GL[i] = 1;
  let k = 0, gk = 0;
  for (let pass = 0; pass < 2; pass++) for (const o of ORBS) {
    if (o.pinned !== (pass === 0)) continue;
    if (o.state === 'gone' || (o.state === 'merge' && o.s <= 0) || o.x === null || k >= 24) continue;
    const q = orbPos(o), rr = o.r * o.s * (1 - (o.bf || 0)), ef = clamp((q.y + o.r) / (P.edgeFade * H), 0, 1), cl = o.detT ? 1 - clamp((now - o.detT) / (P.birthDim * 1000), 0, 1) : 0, kI = P.orbLevel * o.rs * o.dim + (1 - P.orbLevel * o.rs * o.dim) * cl * cl * (3 - 2 * cl), w = (kI * vis + (o.pinned ? P.pinRim : 0)) * ef * ef * (3 - 2 * ef) * (1 - (o.bf || 0)), sh = 40 * (1 - vis);
    const sm = Math.min(1, Math.hypot(o.cx2, o.cy2) / Math.max(1, o.r)), ra = 1 - .25 * sm;
    M.set([q.x + o.cx2, q.y + o.cy2, rr * ra, w], k * 8); M.set([o.qx - o.cx2 * (1 - .5 * (1 - sm)), o.qy + sh - o.cy2 * (1 - .5 * (1 - sm)), rr * (.8 + .2 * sm) * ra, w], k * 8 + 4);
    PN[k] = o.pinned ? P.pinInner : 0;
    if (o.pinned && gk < 4) { GL.set([q.x, q.y, P.auraScale * o.r, P.glowI * vis], gk * 4); gk++; }
    k++;
  }
  HV.NM = k * 2;
  // pin aura: exponential, brightest at the orb, a faint wide tail; fades over auraDur
  if (AUR && ORBS.includes(AUR.o) && now - AUR.t0 < P.auraDur * 1000) {
    const u = (now - AUR.t0) / (P.auraDur * 1000), q = orbPos(AUR.o);
    AU.set([q.x, q.y, P.auraScale * AUR.o.r * (1 + .5 * u), P.auraI * (1 - u) * (1 - u)]);
  } else { AUR = null; AU.fill(0); AU[2] = 1; }

  // label: centered above the orb, shown while dragging (after 10px) or 2.5s after a tap
  const t = textOrb && ORBS.includes(textOrb) ? textOrb : null;
  const showing = t && !hidden && ((drag && drag.o === t && drag.moved > 10) || now - textShowT < 2500);
  if (t) {
    const q = orbPos(t);
    NOTE.style.transform = `translate(${q.x}px,${q.y - t.r * t.s - P.labelGap}px) translate(-50%,-100%)`;
    if (LBL.textContent !== t.text) LBL.textContent = t.text;
  }
  NOTE.classList.toggle('on', !!showing);

  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="icon" href="data:,">
<title>Braindump — home</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#8A8A8A;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:390px;height:844px;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
@media (max-width:500px){.phone{width:100vw;height:100vh;height:100dvh}}
#mback{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:11px;letter-spacing:.06em;color:#555;opacity:0;pointer-events:none}
#mnote{position:absolute;left:0;top:0;max-width:200px;font:13px/1.35 system-ui,"Segoe UI",sans-serif;text-align:center;color:rgba(255,255,255,.7);text-shadow:0 0 14px #000;pointer-events:none;opacity:0;transition:opacity .22s}
#mnote.on{opacity:1}
#mlab{position:absolute;inset:0;pointer-events:none;opacity:0}
#mlab div{position:absolute;left:0;top:0;white-space:nowrap;pointer-events:none;text-shadow:0 0 10px #000}
#mlab .g{font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.5)}
#mlab .n{font-size:11px;color:rgba(255,255,255,.8);opacity:0}
#mhint{position:absolute;left:0;right:0;bottom:52px;text-align:center;font-size:11px;color:#333;opacity:0;transition:opacity 1s;pointer-events:none}
#mhint.on{opacity:1}
canvas{position:absolute;left:0;top:0;display:block;pointer-events:none;touch-action:none}
#msg{position:absolute;left:0;right:0;top:60%;text-align:center;font-size:13px;letter-spacing:.02em;color:#8A8A8A;opacity:0;transition:opacity .4s;pointer-events:none}
#msg.on{opacity:1}
#mic{position:absolute;left:0;right:0;bottom:24px;text-align:center;font-size:11px;color:#444;display:none;pointer-events:none}
#hint{position:absolute;left:0;right:0;top:48px;text-align:center;font-size:11px;color:#333;opacity:0;transition:opacity 1s;pointer-events:none}
#hint.on{opacity:1}
#note{position:absolute;left:0;top:0;max-width:200px;font:13px/1.35 system-ui,"Segoe UI",sans-serif;letter-spacing:.01em;text-align:center;color:rgba(255,255,255,.66);text-shadow:0 0 14px #000;pointer-events:none}
#note i{display:block;font-style:normal;opacity:0;transform:translateY(6px);transition:opacity .22s,transform .22s}
#note.on i{opacity:1;transform:none}
#dev{position:fixed;right:12px;top:12px;width:250px;max-height:90vh;overflow:auto;padding:12px;background:rgba(18,18,18,.82);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:14px;font-size:11px;color:#bbb;z-index:9;display:none}
#dev.on{display:block}
@media (max-width:500px){#dev{left:0;right:0;top:auto;bottom:0;width:auto;max-height:50vh;border-radius:14px 14px 0 0}}
#dev label{display:grid;grid-template-columns:1fr auto;gap:2px 8px;margin-bottom:6px}
#dev input{grid-column:1/3;width:100%}
#dev input[type=search]{margin:8px 0 2px;padding:7px 9px;border:0;border-radius:8px;background:#2a2a2a;color:#ddd;font:12px system-ui,"Segoe UI",sans-serif;outline:none}
#dev .dc{font:600 10px system-ui,"Segoe UI",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#888;margin:10px 0 2px;padding:6px 2px;cursor:pointer;user-select:none}
#dev .dc:hover{color:#ddd}
#dev label.hit{background:rgba(255,255,255,.1);border-radius:8px;padding:4px 6px;margin-left:-6px;margin-right:-6px;box-shadow:inset 2px 0 0 #fff}
#dev label.hit span:first-child{color:#fff}
#dev button{font:11px system-ui,"Segoe UI",sans-serif;color:#ddd;background:#2a2a2a;border:0;border-radius:8px;padding:6px 8px;margin:4px 4px 0 0}
</style>
</head>
<body>
<div class="phone" id="phone">
  <canvas id="gl"></canvas>
  <div id="mlab"></div>
  <div id="mback">↑ home</div>
  <div id="mnote"></div>
  <div id="mhint">two fingers to move, zoom and go home · drag a blob, it springs back · double-tap or shake to reset</div>
  <div id="hint">double-tap to hide thoughts</div>
  <div id="msg"></div>
  <div id="mic">mic off</div>
  <div id="note"><i></i></div>
</div>
<div id="dev"></div>
<script>
// ---- sound + haptics: all synthesized, one key (D major pentatonic) so every sound fits the music ----
// music bus = 0.2 of full scale; Web Audio output is scaled by the device volume, so music is always 20% of what the user set
const SFX = (() => {
  const AC = window.AudioContext || window.webkitAudioContext, PEN = [0, 2, 4, 7, 9], MUS = .2, R = Math.random;
  let ac = null, sfx, mus, rv, noise, recOn = false, musOn = true, musNext = 0, musTick = 0, chordI = 0;
  const lim = {};
  try { musOn = localStorage.getItem('bd_music') !== '0'; } catch (e) {}
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  const nt = i => hz(62 + 12 * Math.floor(i / 5) + PEN[((i % 5) + 5) % 5]); // pentatonic degree, 0 = D4
  const dt = (f, c = 7) => f * Math.pow(2, (R() * 2 - 1) * c / 1200); // tiny detune: never the exact same sound twice
  const vg = g => g * (.86 + R() * .28);
  const gate = (k, ms) => { const n = performance.now(); if (n - (lim[k] || -1e9) < ms) return false; lim[k] = n; return true; };
  const hap = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  function init() {
    if (!AC) return false;
    if (ac) { if (ac.state === 'suspended' && !document.hidden) ac.resume(); return true; }
    ac = new AC({latencyHint:'interactive'});
    const lmt = ac.createDynamicsCompressor(); lmt.threshold.value = -8; lmt.knee.value = 6; lmt.ratio.value = 8; lmt.attack.value = .003; lmt.release.value = .2;
    const master = ac.createGain(); master.connect(lmt); lmt.connect(ac.destination);
    const soft = ac.createBiquadFilter(); soft.type = 'lowpass'; soft.frequency.value = 8500; soft.Q.value = .4; soft.connect(master);
    sfx = ac.createGain(); sfx.gain.value = .45; sfx.connect(soft);
    mus = ac.createGain(); mus.gain.value = 0; mus.connect(master);
    // room: generated stereo tail that darkens as it decays
    const n = Math.floor(ac.sampleRate * 2.6), ir = ac.createBuffer(2, n, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); let lp = 0; for (let i = 0; i < n; i++) { const k = i / n; lp += (R() * 2 - 1 - lp) * (.5 - .42 * k); d[i] = lp * Math.pow(1 - k, 2.4); } }
    rv = ac.createConvolver(); rv.buffer = ir; const rvo = ac.createGain(); rvo.gain.value = .55; rv.connect(rvo); rvo.connect(master);
    const ms = ac.createGain(); ms.gain.value = .8; mus.connect(ms); ms.connect(rv);
    noise = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const nd = noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = R() * 2 - 1;
    document.addEventListener('visibilitychange', () => { if (document.hidden) ac.suspend(); else ac.resume(); });
    if (musOn) musStart();
    return true;
  }
  const ev = fn => (...a) => { if (init()) fn(...a); };

  function vout(wet, bus, pan) { const g = ac.createGain(); if (pan && ac.createStereoPanner) { const p = ac.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, pan)); g.connect(p); p.connect(bus || sfx); } else g.connect(bus || sfx); if (wet) { const s = ac.createGain(); s.gain.value = wet; g.connect(s); s.connect(rv); } return g; }
  function env(g, t, a, pk, d) { g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(pk, t + a); g.gain.setTargetAtTime(0, t + a, d / 4); return t + a + d * 1.2; }
  function osc(type, f, t, end, dst) { const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.connect(dst); o.start(t); o.stop(end); return o; }
  function nz(t, len, dst) { const s = ac.createBufferSource(); s.buffer = noise; s.loop = true; s.connect(dst); s.start(t, R() * .5); s.stop(t + len); return s; }

  // water bubble: sine whose pitch rises as the cavity closes (up < 1 = gulp)
  function plop(f, g, o = {}) {
    const t = ac.currentTime + (o.at || 0), d = o.d || .085, v = vout(o.wet ?? .22, o.bus), end = env(v, t, .006, vg(g), d);
    const s = osc('sine', f = dt(f), t, end, v); s.frequency.exponentialRampToValueAtTime(f * (o.up || 1.8), t + d * .7);
  }
  // liquid tone: sine gliding up into pitch (a drop settling), slow swell, no hard edge, quiet by design; br = a touch of shimmer
  function syn(f, g, o = {}) {
    const t = ac.currentTime + (o.at || 0), d = (o.d || 1) * 1.3, b = o.br ?? .4, v = vout(o.wet ?? .4, o.bus), lp = ac.createBiquadFilter(), end = t + d * 1.3;
    f = dt(f);
    v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(vg(g) * .45, t + .035); v.gain.setTargetAtTime(0, t + .035, d / 4);
    lp.type = 'lowpass'; lp.Q.value = .2; lp.frequency.setValueAtTime(f * 1.5, t); lp.frequency.linearRampToValueAtTime(f * (1.6 + b), t + .08); lp.frequency.setTargetAtTime(f * 1.1, t + .08, d * .3); lp.connect(v);
    osc('sine', f * .94, t, end, lp).frequency.setTargetAtTime(f, t, .035);
    const h = ac.createGain(); h.gain.value = .12 * b; h.connect(lp); osc('triangle', f * .94, t, end, h).frequency.setTargetAtTime(f, t, .035);
  }
  // warm low thump; 2nd/3rd harmonics so phone speakers still convey it
  function sub(f, g, o = {}) {
    const t = ac.currentTime + (o.at || 0), d = o.d || .4, dr = o.dr ?? 1.5, v = vout(o.wet ?? .08, o.bus), end = env(v, t, .006, vg(g), d);
    for (const [m, a] of [[1, 1], [2, .4], [3, .14]]) { const h = ac.createGain(); h.gain.value = a; h.connect(v); osc('sine', f * m * dr, t, end, h).frequency.exponentialRampToValueAtTime(f * m, t + .07); }
  }
  // drop that lands: rounded sine sliding up into pitch, dark, short, panned to where it happened — the split sound
  function pip(f, g, o = {}) {
    const t = ac.currentTime + (o.at || 0), d = o.d || .22, v = vout(o.wet ?? .3, o.bus, o.pan), lp = ac.createBiquadFilter(), end = t + d * 1.4;
    f = dt(f); v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(vg(g), t + .008); v.gain.setTargetAtTime(0, t + .008, d / 4);
    lp.type = 'lowpass'; lp.Q.value = .3; lp.frequency.value = f * 2.2; lp.connect(v);
    osc('sine', f * .82, t, end, lp).frequency.setTargetAtTime(f, t, .012);
    const l = ac.createGain(); l.gain.value = .35; l.connect(lp); osc('sine', f / 2, t, end, l);
  }
  // two drops becoming one: warm sine sinking into pitch with a soft body underneath — the join sound
  function blp(f, g, o = {}) {
    const t = ac.currentTime + (o.at || 0), d = o.d || .32, v = vout(o.wet ?? .35, o.bus, o.pan), end = t + d * 1.4;
    f = dt(f); v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(vg(g), t + .02); v.gain.setTargetAtTime(0, t + .02, d / 4);
    osc('sine', f * 1.19, t, end, v).frequency.setTargetAtTime(f, t, .03);
    const l = ac.createGain(); l.gain.value = .45; l.connect(v); osc('sine', f / 2 * 1.19, t, end, l).frequency.setTargetAtTime(f / 2, t, .04);
  }
  // continuous gesture voices: built once, driven by the gesture, fade out by themselves ~0.1 s after updates stop
  const CV = {};
  function cv(name, build) { const c = CV[name] || (CV[name] = build()); clearTimeout(c.to); c.to = setTimeout(() => c.g.gain.setTargetAtTime(0, ac.currentTime, .15), 90); return c; }
  // water surface under the finger: low band-passed noise with a slow lap (gain + filter wobble), never wind-like
  function washV() {
    const g = ac.createGain(), am = ac.createGain(), bp = ac.createBiquadFilter(), lp = ac.createBiquadFilter(), n = ac.createBufferSource(), v = vout(.4);
    g.gain.value = 0; am.gain.value = .75; bp.type = 'bandpass'; bp.Q.value = .8; bp.frequency.value = 500; lp.type = 'lowpass'; lp.frequency.value = 1200;
    n.buffer = noise; n.loop = true; n.connect(bp); bp.connect(lp); lp.connect(am); am.connect(g); g.connect(v); n.start();
    for (const [hzL, dst, dep] of [[1.7, am.gain, .25], [2.9, bp.frequency, 90], [.6, bp.frequency, 60]]) { const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = hzL; lg.gain.value = dep; l.connect(lg); lg.connect(dst); l.start(); }
    return {g, bp, lp};
  }
  // zoom: soft open fifth whose pitch and brightness follow the zoom level
  function zoomV() {
    const g = ac.createGain(), lp = ac.createBiquadFilter(), v = vout(.5), os = [];
    g.gain.value = 0; lp.type = 'lowpass'; lp.Q.value = 1.5; lp.frequency.value = 500; lp.connect(g); g.connect(v);
    for (const [m, a, ty] of [[50, 1, 'sine'], [57, .5, 'triangle'], [62, .3, 'sine'], [69, .12, 'triangle']]) { const k = ac.createGain(); k.gain.value = a; k.connect(lp); const o = ac.createOscillator(); o.type = ty; o.frequency.value = hz(m); o.connect(k); o.start(); os.push(o); }
    return {g, lp, os};
  }
  // split/join ladder: quick successive splits climb the scale, joins step back down — a little melody you play with the blob
  let lad = 0, ladT = 0;
  const step = dir => { const n = performance.now(); if (n - ladT > 2200) lad = 0; ladT = n; lad = Math.max(-3, Math.min(10, lad + dir)); return lad; };
  // breath: band-passed noise swell sweeping up or down
  function air(up, g, o = {}) {
    const t = ac.currentTime + (o.at || 0), d = o.d || .6, v = vout(o.wet ?? .35, o.bus), bp = ac.createBiquadFilter(), [a, b] = up ? [350, 2200] : [2200, 350];
    bp.type = 'bandpass'; bp.Q.value = .9; bp.frequency.setValueAtTime(a, t); bp.frequency.exponentialRampToValueAtTime(b, t + d); bp.connect(v);
    v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(vg(g), t + d * .45); v.gain.linearRampToValueAtTime(0, t + d);
    nz(t, d + .02, bp);
  }

  // background music: slow crossfading pad chords only (no plucks), inside the same key
  const CH = [[38, 50, 57, 62, 64, 66], [35, 47, 54, 59, 62, 66], [31, 43, 50, 57, 59, 62], [33, 45, 52, 57, 59, 64]]; // Dmaj9 · Bm11 · Gadd9 · A6sus4 (first = bass root)
  const LEN = 12, FADE = 5;
  function chord(t) {
    const c = CH[chordI++ % CH.length], lp = ac.createBiquadFilter(), v = ac.createGain(), end = t + LEN + FADE + .1;
    lp.type = 'lowpass'; lp.Q.value = .3; lp.frequency.setValueAtTime(500, t); lp.frequency.linearRampToValueAtTime(900 + R() * 300, t + LEN * .5); lp.frequency.linearRampToValueAtTime(500, t + LEN + FADE);
    lp.connect(v); v.connect(mus);
    v.gain.setValueAtTime(0, t); v.gain.linearRampToValueAtTime(1, t + FADE); v.gain.setValueAtTime(1, t + LEN); v.gain.linearRampToValueAtTime(0, t + LEN + FADE);
    c.forEach((m, i) => {
      if (!i) { const g = ac.createGain(); g.gain.value = .16; g.connect(v); osc('sine', hz(m), t, end, g); return; }
      for (const ct of [-6, 6]) { const g = ac.createGain(); g.gain.value = .045; g.connect(lp); osc('triangle', hz(m) * Math.pow(2, ct / 1200), t, end, g); }
    });
  }
  function musStart() {
    mus.gain.cancelScheduledValues(ac.currentTime); mus.gain.setTargetAtTime(recOn ? MUS * .12 : MUS, ac.currentTime, 1.2);
    musNext = Math.max(musNext, ac.currentTime + .1); clearInterval(musTick);
    const tick = () => { while (musNext < ac.currentTime + 2) { chord(musNext); musNext += LEN; } };
    tick(); musTick = setInterval(tick, 1000);
  }
  function musStop() { mus.gain.cancelScheduledValues(ac.currentTime); mus.gain.setTargetAtTime(0, ac.currentTime, .4); clearInterval(musTick); }
  // duck under the voice while recording (keeps the mic clean)
  function duck(on) { if (musOn) { mus.gain.cancelScheduledValues(ac.currentTime); mus.gain.setTargetAtTime(on ? MUS * .12 : MUS, ac.currentTime, on ? .15 : 1); } }

  return {
    unlock: init,
    tear() {}, snapBack() {}, ripple() {}, // hooks for the sound session: blob torn from its place / sprung back / background ripple born
    get music() { return musOn; },
    toggleMusic: ev(() => { musOn = !musOn; try { localStorage.setItem('bd_music', musOn ? '1' : '0'); } catch (e) {} if (musOn) musStart(); else musStop(); syn(nt(musOn ? 7 : 2), .25, {d:.8}); hap(6); }),
    recStart: ev(() => { recOn = true; duck(true); sub(hz(38), .55, {d:.5}); plop(nt(0), .35, {up:1.5, d:.12, at:.02}); hap(16); }),
    recStop: ev(() => { recOn = false; duck(false); plop(nt(4), .3, {up:2, d:.08}); sub(hz(45), .35, {d:.3, at:.03}); hap([8, 45, 14]); }),
    saved: ev(() => { [2, 4, 6, 8].forEach((i, k) => syn(nt(i), .2 - k * .025, {at:.06 + k * .075, d:1.2})); sub(hz(50), .3, {at:.04, d:.6}); plop(nt(9), .12, {at:.36}); hap([6, 70, 10]); }),
    processed: ev(() => { syn(nt(7), .16, {d:1.4}); syn(nt(11), .1, {at:.12, d:1.6, br:.3}); hap(6); }),
    warn: ev(() => { if (!gate('warn', 2500)) return; syn(nt(-1), .24, {d:.6, br:.2}); syn(nt(-3), .2, {at:.16, d:.8, br:.2}); hap([18, 90, 18]); }),
    grab: ev(i => { if (!gate('grab', 60)) return; plop(nt(3 + (i % 5)), .16, {up:1.4, d:.05, wet:.05}); hap(4); }),
    tap: ev(i => { const k = 5 + (i % 7); plop(nt(k), .28, {d:.09}); syn(nt(k), .07, {d:.5, br:.2, at:.01}); hap(6); }),
    pin: ev(on => { if (on) { sub(hz(50), .4, {d:.35}); syn(nt(5), .2, {d:1}); syn(nt(9), .08, {at:.05, d:1.2, br:.3}); hap(14); } else { syn(nt(6), .14, {d:.5}); syn(nt(3), .11, {at:.09, d:.7}); hap(8); } }),
    merge: ev(() => { plop(nt(2), .3, {up:.55, d:.14}); hap(8); }),
    absorbed: ev(() => { sub(hz(38), .45, {d:.6, dr:1.3}); syn(nt(0), .1, {at:.03, d:1, br:.2}); hap([6, 40, 10]); }),
    // contacts: v = closing speed (px/s), r = size (px) — bigger = lower, faster = louder
    bump: ev((v, r) => { if (v < 25 || !gate('bump', 40)) return; const k = Math.max(1, Math.min(11, 11 - Math.round(r / 3))), g = Math.min(.24, .03 + v / 1400);
      plop(nt(k), g, {up:1.45, d:.06 + .03 * R(), wet:.2}); syn(nt(k - 5), g * .35, {d:.35, br:.2, wet:.1}); hap(Math.round(3 + g * 30)); }),
    coreTouch: ev(v => { if (!gate('core', 140)) return; const g = Math.min(.3, .06 + v / 1200); sub(hz(50), g, {d:.3, dr:1.25}); plop(nt(0), g * .5, {up:1.3, d:.1}); hap(6); }),
    slice: ev(() => { if (gate('slice', 200)) hap(3); }),
    // split of any piece (big or small): r = piece radius, x = screen 0..1 for panning; smaller = a touch higher
    split: ev((r = 20, x = .5) => { if (!gate('split', 35)) return; const k = 4 + step(1) + (r < 12 ? 2 : 0); pip(nt(k), .085, {pan:(x - .5) * 1.2}); hap(4); }),
    fuse: ev((x = .5) => { if (!gate('fuse', 40)) return; blp(nt(3 + step(-1)), .075, {pan:(x - .5) * 1.2}); hap(3); }),
    heal: ev(() => { lad = 0; sub(hz(50), .14, {d:.5, dr:1.1}); syn(nt(0), .11, {d:1.1, br:.2}); syn(nt(4), .07, {at:.07, d:1.2, br:.2}); hap([4, 30, 6]); }),
    pull: ev(() => { air(true, .03, {d:.4, wet:.4}); hap(3); }),
    // finger moving over the screen (home, blob drag, map pan): sp = px/s; heavy = dragging the blob itself (deeper water)
    stroke: ev((sp, heavy) => { if (recOn) return; const c = cv('wash', washV), l = Math.min(1, sp / 1600), t = ac.currentTime, h = heavy ? .6 : 1;
      c.g.gain.setTargetAtTime(.075 * Math.sqrt(l) * (heavy ? 1.3 : 1), t, .06); c.bp.frequency.setTargetAtTime((320 + 900 * l) * h, t, .08); c.lp.frequency.setTargetAtTime((800 + 2200 * l) * h, t, .08); }),
    // z = map zoom (0.25..12), dl = ln of this step's zoom factor
    zoom: ev((z, dl) => { const c = cv('zoom', zoomV), k = Math.max(0, Math.min(1, Math.log(z / .25) / Math.log(48))), t = ac.currentTime;
      c.lp.frequency.setTargetAtTime(260 + 2200 * k * k, t, .08); for (const o of c.os) o.detune.setTargetAtTime((k - .4) * 700, t, .1);
      c.g.gain.setTargetAtTime(Math.min(.09, .025 + Math.abs(dl) * 2), t, .05); }),
    // map node drag (not built yet): grab, contact with another node, release
    nodeGrab: ev(i => { plop(nt(3 + (i % 9)), .14, {up:1.4, d:.06}); hap(5); }),
    nodeDrop: ev(i => { plop(nt(3 + (i % 9)), .12, {up:.7, d:.08}); sub(hz(50), .12, {d:.2}); hap(6); }),
    splash: ev(() => { if (recOn || !gate('spl', 45)) return; plop(nt(6 + Math.floor(R() * 8)), .07 + R() * .05, {d:.04 + R() * .03, up:1.6 + R() * .8, wet:.25}); }),

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="icon" href="data:,">
<title>Braindump — home2-B · Breathing light</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#050505;color:#8A8A8A;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:390px;height:844px;background:#050505;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
@media (max-width:500px){.phone{width:100vw;height:100vh;height:100dvh}}
.panel{position:absolute;inset:0;background:#050505;will-change:transform}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.edge{position:absolute;left:0;right:0;height:120px;pointer-events:none;--a:.04}
.edge.t{top:0;background:linear-gradient(rgba(255,255,255,var(--a)),rgba(255,255,255,0))}
.edge.b{bottom:0;background:linear-gradient(0deg,rgba(255,255,255,var(--a)),rgba(255,255,255,0))}
#msg{position:absolute;left:0;right:0;top:60%;text-align:center;font-size:13px;letter-spacing:.02em;color:#8A8A8A;opacity:0;transition:opacity .4s;pointer-events:none}
#msg.on{opacity:1}
#list{position:absolute;left:28px;right:28px;top:72px;list-style:none}
.row{position:relative;margin-bottom:28px;cursor:pointer}
.t{display:block;font-size:11px;color:#5A5A5A;letter-spacing:.02em}
.tx{display:block;font-size:15px;color:#D0D0D0;margin-top:4px;line-height:1.35;transition:color .4s}
.row.on .tx{color:#FFFFFF}
.bar{display:block;height:1px;margin-top:8px;background:#BFBFBF;transform:scaleX(0);transform-origin:left}
.tip{position:absolute;left:0;top:0;max-width:200px;font-size:13px;line-height:1.35;color:#D0D0D0;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.tip.on{opacity:1}
</style>
</head>
<body>
<div class="phone" id="phone">
  <section class="panel" id="home">
    <canvas id="gl"></canvas>
    <div class="edge t" id="eT"></div>
    <div class="edge b" id="eB"></div>
    <div id="msg"></div>
  </section>
  <section class="panel" id="tl">
    <ul id="list"></ul>
    <div class="edge b"></div>
  </section>
  <section class="panel" id="map">
    <canvas id="mg"></canvas>
    <div class="edge t"></div>
    <div class="tip" id="tip"></div>
  </section>
</div>
<script>
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2, PH = $('#phone'), HOME = $('#home'), TL = $('#tl'), MAP = $('#map');
const MSG = $('#msg'), TIP = $('#tip'), LIST = $('#list'), eT = $('#eT'), eB = $('#eB');
const NOTES = [
  {time:'09:12', text:'Call mom about the weekend trip', dur:14},
  {time:'Yesterday 22:31', text:'Pitch: the app name should feel like light', dur:22},
  {time:'Yesterday 18:05', text:'Dentist moved to the 28th, confirm it', dur:8},
  {time:'Mon 14:20', text:'Garden layout: tomatoes on the south side', dur:31},
  {time:'Sun 11:02', text:"Grandpa's story about the boat in '74", dur:47},
  {time:'Sun 09:40', text:'Buy oat milk, check the lease renewal date', dur:9}
];
const CL = [[.27, .3], [.73, .47], [.4, .74]];
let sd = 7;
const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
const NODES = [];
CL.forEach(c => { for (let j = 0; j < 6; j++) {
  const a = rnd() * TAU, r = .03 + rnd() * .08;
  NODES.push({nx:c[0] + Math.cos(a) * r, ny:c[1] + Math.sin(a) * r, ph:rnd() * TAU, text:NOTES[j].text});
} });

const VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS = `precision highp float;
uniform vec2 uRes;uniform float uDpr,uT,uLvl,uRec,uScale,uMode;
uniform vec4 uB[40];uniform vec4 uP[32];
float hs(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float vn(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hs(i),hs(i+vec2(1.,0.)),f.x),mix(hs(i+vec2(0.,1.)),hs(i+vec2(1.,1.)),f.x),f.y);}
float bgc(vec2 q){float hh=uRes.y/uDpr;return mix(.0196,.0431,1.-q.y/hh)+(vn(q*.03+vec2(0.,uT*.02))-.5)*.012;}
void main(){
  vec2 p=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y)/uDpr;
  vec2 D=vec2(0.);float rip=0.;
  for(int j=0;j<32;j++){
    vec4 q=uP[j];if(q.w<=0.)continue;
    vec2 dv=p-q.xy;float d=length(dv);float R=q.z*340.;
    float env=exp(-pow(d-R,2.)/3200.)*q.w*exp(-d/420.);
    float wv=sin((d-R)*.085)*env;
    D+=dv/(d+1e-3)*wv*16.;rip+=abs(wv);
  }
  vec2 s=p+D;
  float bgv=bgc(s);
  float I=0.;
  for(int i=0;i<40;i++){vec4 b=uB[i];if(b.z<=0.)continue;vec2 q=(s-b.xy)/vec2(b.z*b.w,b.z);I+=exp(-.5*dot(q,q));}
  float fbm=vn(p*.012+vec2(uT*.08,uT*.05))*.6+vn(p*.03-vec2(uT*.12,0.))*.3+vn(p*.08+vec2(uT*.2))*.1;
  float g=uMode>.5?.7:.22*uScale*(1.+.8*uLvl*uRec)*(.8+.4*fbm*(.5+uRec));
  float a=(1.-exp(-I))*g+rip*.05*(1.-uMode);
  gl_FragColor=vec4(mix(vec3(bgv),vec3(1.),clamp(a,0.,1.)),1.);
}`;

let W = 0, H = 0, DPR = 1, T = 0, last = performance.now(), br = 0;
let lvl = 0, rv = 0, pos = 0, off = 0, tw = null, drag = null, dragDy = 0, moved = 0;
let rec = false, recId = null, recT0 = 0, shown = -1;
const sc = {x:1, v:0, t:1};
const PTS = [];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function makeView(id) {
  const cv = document.getElementById(id), g = cv.getContext('webgl', {alpha:false, antialias:false});
  const v = {cv, gl:g, L:{}, B:new Float32Array(160), P:new Float32Array(128)};
  if (!g) return v;
  const sh = (t, s) => { const o = g.createShader(t); g.shaderSource(o, s); g.compileShader(o); return o; };
  const pr = g.createProgram();
  g.attachShader(pr, sh(g.VERTEX_SHADER, VS)); g.attachShader(pr, sh(g.FRAGMENT_SHADER, FS));
  g.linkProgram(pr); g.useProgram(pr);
  g.bindBuffer(g.ARRAY_BUFFER, g.createBuffer());
  g.bufferData(g.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), g.STATIC_DRAW);
  const at = g.getAttribLocation(pr, 'a'); g.enableVertexAttribArray(at); g.vertexAttribPointer(at, 2, g.FLOAT, false, 0, 0);
  ['uRes','uDpr','uT','uLvl','uRec','uScale','uMode','uB','uP'].forEach(n => v.L[n] = g.getUniformLocation(pr, n));
  return v;
}
const HV = makeView('gl'), MV = makeView('mg');

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2); W = PH.clientWidth; H = PH.clientHeight;
  [HV, MV].forEach(v => { v.cv.width = W * DPR; v.cv.height = H * DPR; });
}
window.addEventListener('resize', resize);
resize();

function draw(v, isMap) {
  const g = v.gl; if (!g) return;
  const L = v.L;
  g.viewport(0, 0, v.cv.width, v.cv.height);
  g.uniform2f(L.uRes, v.cv.width, v.cv.height); g.uniform1f(L.uDpr, DPR); g.uniform1f(L.uT, T);
  g.uniform1f(L.uLvl, isMap ? 0 : lvl); g.uniform1f(L.uRec, isMap ? 0 : rv);
  g.uniform1f(L.uScale, sc.x * (1 + .1 * br)); g.uniform1f(L.uMode, isMap ? 1 : 0);
  g.uniform4fv(L.uB, v.B); g.uniform4fv(L.uP, v.P);
  g.drawArrays(g.TRIANGLES, 0, 3);
}
function pack(B, list) { B.fill(0); list.forEach((b, k) => B.set(b, k * 4)); }
function touch(now, P) {
  P.fill(0);
  PTS.forEach((q, i) => {
    const a = (now - q.t) / 1000, w = 1 - a / 1.2;
    if (w > 0) P.set([q.x, q.y, a, w], i * 4);
  });
}

// timeline
NOTES.forEach(n => {
  const li = document.createElement('li');
  li.className = 'row';
  li.innerHTML = `<span class="t">${n.time}</span><span class="tx">${n.text}</span><span class="bar"></span>`;
  li.onclick = () => play(li, n.dur);
  LIST.appendChild(li);
});
function play(li, dur) {
  const was = li.classList.contains('on');
  LIST.querySelectorAll('.row.on').forEach(r => {
    r.classList.remove('on');
    const b = r.querySelector('.bar'); b.style.transition = 'none'; b.style.transform = 'scaleX(0)';
  });
  if (was) return;
  const b = li.querySelector('.bar');
  void b.offsetWidth;
  li.classList.add('on'); b.style.transition = `transform ${dur}s linear`; b.style.transform = 'scaleX(1)';
}

// recording
function startRec(id) {
  rec = true; recId = id; recT0 = performance.now(); shown = -1; sc.t = 1.35;
  MSG.classList.add('on');
}
function stopRec() {
  rec = false; sc.t = 1; MSG.textContent = 'Saved'; MSG.classList.add('on');
  setTimeout(() => { if (!rec) MSG.classList.remove('on'); }, 1500);
}
function spring(s, dt) {
  const a = (s.t - s.x) * 70 - s.v * 12.5;
  s.v += a * dt; s.x += s.v * dt;
}

// navigation
const pt = e => { const r = PH.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; };
function setPos(n) { tw = {from:off, t0:performance.now()}; pos = n; }
function step(d) { const n = clamp(pos + d, -1, 1); if (n !== pos) setPos(n); }

PH.addEventListener('pointerdown', e => {
  const p = pt(e);
  if (pos === 0 && !rec && Math.hypot(p.x - W / 2, p.y - H * .8) < 90) { startRec(e.pointerId); return; }
  drag = {id:e.pointerId, y0:p.y, x0:p.x}; dragDy = 0; moved = 0;
  if (pos === 0) { PTS.push({x:p.x, y:p.y, t:performance.now()}); if (PTS.length > 32) PTS.shift(); }
});
window.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const p = pt(e);
  dragDy = p.y - drag.y0; moved = Math.max(moved, Math.hypot(p.x - drag.x0, p.y - drag.y0));
  if (pos === 0 && !rec) { PTS.push({x:p.x, y:p.y, t:performance.now()}); if (PTS.length > 32) PTS.shift(); }
});
function end(e) {
  if (rec && e.pointerId === recId) stopRec();
  if (!drag || e.pointerId !== drag.id) return;
  const d = dragDy, tap = pos === -1 && moved < 8 ? drag : null;
  drag = null; dragDy = 0;
  if (tap) mapTap(tap.x0, tap.y0);
  if (d > 80) step(1); else if (d < -80) step(-1); else setPos(pos);
}
window.addEventListener('pointerup', end);
window.addEventListener('pointercancel', end);
PH.addEventListener('wheel', e => {
  e.preventDefault();
  if (tw || drag || rec) return;
  step(e.deltaY > 0 ? 1 : -1);
}, {passive:false});
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') step(1);
  else if (e.key === 'ArrowUp') step(-1);
});

function mapTap(x, y) {
  const hit = NODES.find(n => Math.hypot(n.px - x, n.py - y) < 22);
  if (!hit) { TIP.classList.remove('on'); return; }
  TIP.textContent = hit.text;
  TIP.style.transform = `translate(${hit.px + 14}px,${hit.py - 24}px)`;
  TIP.classList.add('on');
}

function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30); last = now; T += dt;
  if (drag) off = pos * H + dragDy;
  else if (tw) {
    const p = Math.min(1, (now - tw.t0) / 450), e = 1 - Math.pow(1 - p, 3);
    off = tw.from + (pos * H - tw.from) * e;
    if (p >= 1) tw = null;
  } else off = pos * H;
  HOME.style.transform = `translateY(${off}px)`;
  TL.style.transform = `translateY(${off - H}px)`;
  MAP.style.transform = `translateY(${off + H}px)`;
  eT.style.setProperty('--a', (.04 + Math.min(.08, drag ? Math.max(0, dragDy) / 400 : 0)).toFixed(3));
  eB.style.setProperty('--a', (.04 + Math.min(.08, drag ? Math.max(0, -dragDy) / 400 : 0)).toFixed(3));

  spring(sc, dt);
  const vt = rec ? clamp(.5 + .5 * (.55 * Math.sin(T * 1.7) + .3 * Math.sin(T * 3.9 + 1.3) + .15 * Math.sin(T * 7.3) + (Math.random() * 2 - 1) * .3), 0, 1) : 0;
  lvl += (vt - lvl) * Math.min(1, dt * 6);
  rv += ((rec ? 1 : 0) - rv) * Math.min(1, dt * 4);
  if (rec) {
    const s = Math.floor((now - recT0) / 1000);
    if (s !== shown) { shown = s; MSG.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  }

  // three light lobes at the bottom edge; they rise and brighten with the voice level
  br = .5 - .5 * Math.cos(T * TAU / 5);
  const lobes = [];
  for (let i = 0; i < 3; i++) {
    const sy = H * .14 * (1 + .15 * Math.sin(T * .19 + i)) + rv * H * .04;
    lobes.push([W * (.5 + .3 * Math.sin(T * .07 + i * 2.1)),
      H * (.92 - .03 * Math.sin(T * .11 + i * 1.7)) - rv * lvl * H * .05,
      sy, W * .22 / sy]);
  }
  pack(HV.B, lobes);
  touch(now, HV.P);

  if (off > -H && off < H) draw(HV, false);
  if (off > -H && off < 0) {
    pack(MV.B, NODES.map(n => {
      n.px = n.nx * W + Math.sin(T * .6 + n.ph) * 3; n.py = n.ny * H + Math.cos(T * .5 + n.ph) * 3;
      return [n.px, n.py, 7, 1];
    }));
    draw(MV, true);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

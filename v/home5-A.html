<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<link rel="icon" href="data:,">
<title>Braindump — home5-A · Depth / light</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#8A8A8A;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
.phone{position:relative;width:390px;height:844px;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
@media (max-width:500px){.phone{width:100vw;height:100vh;height:100dvh}}
canvas{position:absolute;left:0;top:0;display:block;pointer-events:none;touch-action:none}
.edge{position:absolute;left:0;right:0;height:50%;pointer-events:none}
.edge.t{top:0;background:radial-gradient(ellipse 55% 40% at 50% 0%,rgba(255,255,255,.03),rgba(255,255,255,0))}
.edge.b{bottom:0;background:radial-gradient(ellipse 55% 40% at 50% 100%,rgba(255,255,255,.03),rgba(255,255,255,0))}
#msg{position:absolute;left:0;right:0;top:60%;text-align:center;font-size:13px;letter-spacing:.02em;color:#8A8A8A;opacity:0;transition:opacity .4s;pointer-events:none}
#msg.on{opacity:1}
.panel{position:absolute;inset:0;background:#000;z-index:5;pointer-events:none;visibility:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s .45s}
.panel.open{pointer-events:auto;visibility:visible;transition:transform .45s cubic-bezier(.2,.8,.2,1),visibility 0s}
#tl{transform:translateY(100%)}#tl.open{transform:none}
#map{transform:translateY(-100%)}#map.open{transform:none}
#list{padding:72px 32px 0;list-style:none}
.row{margin-bottom:28px;cursor:pointer}
.t{display:block;font-size:11px;color:#555;letter-spacing:.02em}
.tx{display:block;font-size:16px;color:#D6D6D6;margin-top:4px;line-height:1.45;transition:color .4s}
.row.on .tx{color:#FFFFFF}
.bar{display:block;height:1px;margin-top:8px;background:#FFFFFF;transform:scaleX(0);transform-origin:left}
.tip{position:absolute;left:0;top:0;max-width:200px;font-size:13px;line-height:1.35;color:#D0D0D0;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.tip.on{opacity:1}
</style>
</head>
<body>
<div class="phone" id="phone">
  <canvas id="gl"></canvas>
  <div class="edge t"></div>
  <div class="edge b"></div>
  <div id="msg"></div>
  <section class="panel" id="tl"><ul id="list"></ul></section>
  <section class="panel" id="map"><canvas id="mg"></canvas><div class="tip" id="tip"></div></section>
</div>
<script>
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2, PH = $('#phone'), TLEL = $('#tl'), MAPEL = $('#map');
const MSG = $('#msg'), TIP = $('#tip'), LIST = $('#list');
const NOTES = [
  {time:'09:12', text:'Call mom about the weekend trip', dur:14},
  {time:'Yesterday 22:31', text:'Pitch: the app name should feel like light', dur:22},
  {time:'Yesterday 18:05', text:'Dentist moved to the 28th, confirm it', dur:8},
  {time:'Mon 14:20', text:'Garden layout: tomatoes on the south side', dur:31},
  {time:'Sun 11:02', text:"Grandpa's story about the boat in '74", dur:47},
  {time:'Sun 09:40', text:'Buy oat milk, check the lease renewal date', dur:9}
];
const CL = [[.27, .3], [.73, .47], [.4, .74]];
let sd = 7;
const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
const NODES = [];
CL.forEach(c => { for (let j = 0; j < 6; j++) {
  const a = rnd() * TAU, r = .03 + rnd() * .08;
  NODES.push({nx:c[0] + Math.cos(a) * r, ny:c[1] + Math.sin(a) * r, s:4 + rnd() * 2, ph:rnd() * TAU, text:NOTES[j].text});
} });

const VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}';
const FS = `precision highp float;
uniform vec2 uRes;uniform float uDpr,uT,uRim,uGR,uR;uniform vec2 uLD;uniform vec4 uB[40];
void main(){
  vec2 p=vec2(gl_FragCoord.x,uRes.y-gl_FragCoord.y)/uDpr;
  float f=0.;vec2 G=vec2(0.);
  for(int i=0;i<40;i++){vec4 b=uB[i];if(b.z<=0.)continue;vec2 dv=p-b.xy;float d2=max(dot(dv,dv),1.);float r2=b.z*b.z;f+=r2/d2;G-=2.*r2*dv/(d2*d2);}
  float gn=max(length(G),1e-4);
  float sd=(f-1.)/gn;
  float m=smoothstep(-.7,.7,sd);
  float og=exp(-max(-sd,0.)/uGR);
  float edge=1.-smoothstep(1.,1.8,f);
  vec3 N=normalize(vec3(-G/gn*edge*.9,1.));
  vec3 Lv=normalize(vec3(uLD,.7)),Hv=normalize(Lv+vec3(0.,0.,1.));
  float side=pow(max(dot(N.xy,uLD),0.),2.);
  float rim=edge*edge*uRim*(.6+1.2*side);
  float sp=pow(max(dot(N,Hv),0.),120.)*.35*edge;
  float bg=0.;
  if(uR>0.){
    vec2 C=vec2(uRes.x/uDpr*.5,uRes.y/uDpr*.8);
    bg=.0196*(1.-smoothstep(0.,160.,length(p-C)));
    vec2 e=(p-vec2(C.x,C.y+uR*.9))/vec2(uR*1.1,uR*.28);
    bg*=1.-.5*exp(-dot(e,e)*1.5);
  }
  float c=mix(bg,.039+rim+sp,m)+og*(1.-m)*.08;
  gl_FragColor=vec4(vec3(c),1.);
}`;

let W = 0, H = 0, DPR = 1, T = 0, last = performance.now(), br = 0;
let lvl = 0, rv = 0, rimS = .45, grS = 18, mode = 0, mapLive = false, mapTimer = 0;
let rec = false, recId = null, recT0 = 0, shown = -1, drop = null, busy = false;
let drag = null, moved = 0, wheelLock = 0;
let LD = [-.4, -.6], LT = [-.4, -.6], lastIn = -1e9;
function setLT(p) { LT = [clamp((p.x - W / 2) / (W / 2) * .6, -.6, .6), clamp((p.y - H * .8) / (H * .5) * .6, -.6, .6)]; }
if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission !== 'function')
  window.addEventListener('deviceorientation', e => { if (e.gamma == null) return; lastIn = performance.now(); LT = [clamp(e.gamma / 45 * .6, -.6, .6), clamp((e.beta - 45) / 45 * .6, -.6, .6)]; });
const sc = {x:1, v:0, t:1};
const PTS = [];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function makeView(id) {
  const cv = document.getElementById(id), g = cv.getContext('webgl', {alpha:false, antialias:false});
  const v = {cv, gl:g, L:{}, B:new Float32Array(160)};
  if (!g) return v;
  const sh = (t, s) => { const o = g.createShader(t); g.shaderSource(o, s); g.compileShader(o); return o; };
  const pr = g.createProgram();
  g.attachShader(pr, sh(g.VERTEX_SHADER, VS)); g.attachShader(pr, sh(g.FRAGMENT_SHADER, FS));
  g.linkProgram(pr); g.useProgram(pr);
  g.bindBuffer(g.ARRAY_BUFFER, g.createBuffer());
  g.bufferData(g.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), g.STATIC_DRAW);
  const at = g.getAttribLocation(pr, 'a'); g.enableVertexAttribArray(at); g.vertexAttribPointer(at, 2, g.FLOAT, false, 0, 0);
  ['uRes','uDpr','uT','uRim','uGR','uB','uLD','uR'].forEach(n => v.L[n] = g.getUniformLocation(pr, n));
  return v;
}
const HV = makeView('gl'), MV = makeView('mg');

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2); W = PH.clientWidth; H = PH.clientHeight;
  [HV, MV].forEach(v => {
    v.cv.width = Math.round(W * DPR); v.cv.height = Math.round(H * DPR);
    v.cv.style.width = W + 'px'; v.cv.style.height = H + 'px';
  });
}
window.addEventListener('resize', resize);
resize();

function draw(v, rim, gr) {
  const g = v.gl; if (!g) return;
  const L = v.L;
  g.viewport(0, 0, v.cv.width, v.cv.height);
  g.uniform2f(L.uRes, v.cv.width, v.cv.height); g.uniform1f(L.uDpr, DPR); g.uniform1f(L.uT, T);
  g.uniform1f(L.uRim, rim); g.uniform1f(L.uGR, gr);
  g.uniform4fv(L.uB, v.B); g.uniform2f(L.uLD, LD[0], LD[1]); g.uniform1f(L.uR, v === HV ? 1 : 0);
  g.drawArrays(g.TRIANGLES, 0, 3);
}
function pack(B, list) { B.fill(0); list.forEach((b, k) => B.set(b, k * 4)); }

// timeline
NOTES.forEach(n => {
  const li = document.createElement('li');
  li.className = 'row';
  li.innerHTML = `<span class="t">${n.time}</span><span class="tx">${n.text}</span><span class="bar"></span>`;
  li.onclick = () => play(li, n.dur);
  LIST.appendChild(li);
});
function play(li, dur) {
  const was = li.classList.contains('on');
  LIST.querySelectorAll('.row.on').forEach(r => {
    r.classList.remove('on');
    const b = r.querySelector('.bar'); b.style.transition = 'none'; b.style.transform = 'scaleX(0)';
  });
  if (was) return;
  const b = li.querySelector('.bar');
  void b.offsetWidth;
  li.classList.add('on'); b.style.transition = `transform ${dur}s linear`; b.style.transform = 'scaleX(1)';
}

// recording
function startRec(id) {
  rec = true; recId = id; recT0 = performance.now(); shown = -1; sc.t = 1.15; drop = null;
  MSG.classList.add('on');
}
function stopRec() {
  rec = false; sc.t = 1; drop = {t0:performance.now()};
  MSG.classList.remove('on');
}
function spring(s, dt) {
  const a = (s.t - s.x) * 70 - s.v * 12.5;
  s.v += a * dt; s.x += s.v * dt;
}

// navigation: mode 1 = map (slides from top), -1 = timeline (slides from bottom), 0 = home
function setMode(m) {
  if (m === mode) return;
  if (mode === 1 && m !== 1) { clearTimeout(mapTimer); mapTimer = setTimeout(() => mapLive = false, 500); }
  if (m === 1) { mapLive = true; clearTimeout(mapTimer); }
  mode = m; TIP.classList.remove('on');
  MAPEL.classList.toggle('open', m === 1); TLEL.classList.toggle('open', m === -1);
}
function gesture(dir) {
  if (mode === 0) setMode(dir);
  else if (dir === -mode) setMode(0);
}
const pt = e => { const r = PH.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; };
function addPt(x, y) { PTS.push({x, y, t:performance.now()}); if (PTS.length > 12) PTS.shift(); }

PH.addEventListener('pointerdown', e => {
  if (e.target.closest('.row') || e.target.closest('#tip')) { drag = {id:e.pointerId, x0:pt(e).x, y0:pt(e).y}; moved = 0; return; }
  const p = pt(e);
  if (mode === 0 && !rec && Math.hypot(p.x - W / 2, p.y - H * .8) < 90) { startRec(e.pointerId); drag = null; return; }
  drag = {id:e.pointerId, x0:p.x, y0:p.y}; moved = 0;
  if (mode === 0) addPt(p.x, p.y);
});
window.addEventListener('pointermove', e => {
  lastIn = performance.now(); setLT(pt(e));
  if (!drag || e.pointerId !== drag.id) return;
  const p = pt(e);
  moved = Math.max(moved, Math.hypot(p.x - drag.x0, p.y - drag.y0));
  if (mode === 0 && !rec) addPt(p.x, p.y);
});
function end(e) {
  if (rec && e.pointerId === recId) { stopRec(); return; }
  if (!drag || e.pointerId !== drag.id) return;
  const p = pt(e), dx = p.x - drag.x0, dy = p.y - drag.y0, d = drag;
  drag = null;
  if (Math.abs(dy) > 60 && Math.abs(dy) > Math.abs(dx)) gesture(dy > 0 ? 1 : -1);
  else if (mode === 1 && moved < 8) mapTap(d.x0, d.y0);
}
window.addEventListener('pointerup', end);
window.addEventListener('pointercancel', e => { if (rec && e.pointerId === recId) stopRec(); drag = null; });
PH.addEventListener('wheel', e => {
  e.preventDefault();
  const now = performance.now();
  if (now - wheelLock < 500 || rec) return;
  wheelLock = now; gesture(e.deltaY > 0 ? 1 : -1);
}, {passive:false});
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') gesture(1);
  else if (e.key === 'ArrowUp') gesture(-1);
});

function mapTap(x, y) {
  const hit = NODES.find(n => Math.hypot(n.px - x, n.py - y) < 22);
  if (!hit) { TIP.classList.remove('on'); return; }
  TIP.textContent = hit.text;
  TIP.style.transform = `translate(${hit.px + 14}px,${hit.py - 24}px)`;
  TIP.classList.add('on');
}

function frame(now) {
  const dt = Math.min((now - last) / 1000, 1 / 30); last = now; T += dt;
  spring(sc, dt);
  const vt = rec ? clamp(.5 + .5 * (.55 * Math.sin(T * 1.7) + .3 * Math.sin(T * 3.9 + 1.3) + .15 * Math.sin(T * 7.3) + (Math.random() * 2 - 1) * .3), 0, 1) : 0;
  lvl += (vt - lvl) * Math.min(1, dt * 6);
  rv += ((rec ? 1 : 0) - rv) * Math.min(1, dt * 4);
  if (rec) {
    const s = Math.floor((now - recT0) / 1000);
    if (s !== shown) { shown = s; MSG.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  }

  if (performance.now() - lastIn > 3000) LT = [.6 * Math.cos(T * TAU / 20), .6 * Math.sin(T * TAU / 20)];
  LD[0] += (LT[0] - LD[0]) * .06; LD[1] += (LT[1] - LD[1]) * .06;
  // idle breathing: scale +-2.5% over 5.5s (ease-in-out); rim and glow follow
  br = .5 - .5 * Math.cos(T * TAU / 5.5);
  rimS += ((rec ? .6 + .4 * lvl : .45 + .15 * br) - rimS) * .12;
  grS += ((18 + 16 * lvl * rv) - grS) * .12;
  const R = 72 * sc.x * (1 + .025 * (2 * br - 1)), cx = W / 2, cy = H * .8;

  // one body: center ball + 4 orbiting balls (periods 9-14s); offset capped at .55R idle, .85R recording
  const hb = [[cx, cy, R * .55 * (1 + .1 * Math.sin(T * 1.1)), 0]];
  for (let i = 0; i < 4; i++) {
    const a = TAU * T / (9 + i * 1.7) + i * TAU / 4, cap = R * (.55 + .3 * rv);
    const rad = Math.min(cap, R * (.45 + .1 * br + .25 * rv));
    hb.push([cx + Math.cos(a) * rad, cy + Math.sin(a * 1.2 + i) * rad * .75,
      R * .34 * (1 + .04 * Math.sin(T * 1.3 + i * 2)) * (1 + .25 * lvl * Math.sin(T * 7 + i * 1.7)), 0]);
  }

  // release: droplet pinches off the top (300ms), then rises 180px over 1.4s while shrinking
  if (drop) {
    const e = performance.now() - drop.t0;
    if (e < 300) hb.push([cx, cy - R * (.55 + .4 * e / 300), 10, 0]);
    else {
      const u = (e - 300) / 1400;
      if (u >= 1) drop = null;
      else hb.push([cx, cy - R * .95 - 180 * (1 - Math.pow(1 - u, 3)), 10 * (1 - u), 0]);
    }
  }

  const tb = [];
  PTS.forEach(q => { const w = 1 - (now - q.t) / 900; if (w > 0) tb.push([q.x, q.y, 28 * w, 0]); });
  pack(HV.B, hb.concat(tb));
  draw(HV, rimS, grS);

  if (mapLive) {
    pack(MV.B, NODES.map(n => {
      n.px = n.nx * W + Math.sin(T * .6 + n.ph) * 3; n.py = n.ny * H + Math.cos(T * .5 + n.ph) * 3;
      return [n.px, n.py, n.s, 0];
    }));
    draw(MV, .45, 18);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
